<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Primitive Lab v0.6.1</title><style>
*[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#11141b;color:#e8edf6;font:10px -apple-system,BlinkMacSystemFont,sans-serif}header{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 9px;border-bottom:1px solid #303746}header b{font-size:11px}.actions{display:flex;gap:4px}button,select{border:1px solid #3a4659;background:#222b38;color:#dce7f7;border-radius:5px;padding:4px;font:inherit}button:disabled{opacity:.3}button.active{background:#2d5887;border-color:#6b9bca}#viewport{height:43dvh;min-height:225px;background:#1b212b;position:relative;touch-action:none}.hint{position:absolute;bottom:7px;left:9px;color:#8f9db0;font-size:9px;pointer-events:none}main{height:calc(100dvh - 30px - 43dvh);display:grid;grid-template-columns:var(--split, 50%) 6px minmax(0,1fr);overflow:hidden}.panel{min-width:0;overflow:auto;padding:6px 5px 20px}.dividerHandle{background:#354153;touch-action:none;cursor:col-resize;position:relative}.dividerHandle:after{content:"";position:absolute;top:45%;left:2px;width:2px;height:30px;border-radius:3px;background:#83b6f5}.tabbar{display:flex;gap:3px;margin-bottom:5px}.tabbar button{flex:1;font-size:9px}.arrayField{display:flex;align-items:center;gap:3px;margin:3px 0}.arrayField label{width:50px;flex:none;color:#b7c5d9;font-size:9px}.arrayField input[type=range]{flex:1;min-width:0;accent-color:#78aefe}.arrayField output{width:28px;text-align:right;color:#9cc5ff;font-size:9px}.arrayField select{width:100%;min-width:0}.panelTitle{color:#9bb1d1;font-size:10px;margin:2px 0 8px}.row{display:flex;align-items:center;gap:2px;margin:2px 0}.row label{width:54px;flex:none;color:#b7c5d9;font-size:9px}.row input{flex:1;min-width:0;accent-color:#78aefe;height:13px}.row output{width:26px;text-align:right;color:#9cc5ff;font-variant-numeric:tabular-nums;user-select:none;font-size:9px}.group{font-size:9px;color:#748ca8;margin:7px 0 3px;border-bottom:1px solid #293444;padding-bottom:2px}.shading{display:flex;gap:4px}.shading button{flex:1}.mini-reset{padding:1px 2px;min-width:16px;color:#a7bbd7;background:transparent;border-color:#303c4e}.object{display:flex;align-items:center;gap:3px;padding:7px 4px;border:1px solid #303c4e;border-radius:5px;margin:3px 0;cursor:pointer}.object.selected{background:#2a4c70;border-color:#6894c3}.object .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.addbar{display:flex;gap:4px;margin:7px 0}.addbar select{min-width:0;flex:1}.addbar button{white-space:nowrap;background:#315b86}.empty{color:#8798af;font-size:9px}.note{color:#78899f;font-size:9px;line-height:1.4;margin-top:8px}</style></head><body><header><b>PRIMITIVE LAB <span style="color:#83b6f5">v0.6.1</span></b><div class="actions"><button id="undo">↶ Undo</button><button id="redo">↷ Redo</button><button id="reset">Reset</button></div></header><div id="viewport"><span class="hint">1本指: 回転 / 2本指: 移動・ズーム</span></div><main id="workspace"><section class="panel"><div class="panelTitle">SCENE OBJECTS</div><div id="objects"></div><div class="addbar"><select id="addType"><option value="cylinder">円柱（パラメトリック）</option><option value="box">立方体</option><option value="sphere">球体</option></select><button id="add">＋追加</button></div><p class="note">最大5個。すべて中央に重ねて表示します。</p></section><div id="dividerHandle" class="dividerHandle" role="separator" aria-label="パネル幅を変更"></div><section class="panel"><div class="tabbar"><button id="tabProps" class="active">Properties</button><button id="tabArray">配列 / Scatter</button></div><div id="propertiesTab"><div id="parameters"><div class="group">DIMENSIONS</div><div id="sizeSlot"></div><div id="heightSlot"></div><div class="group">PROFILE</div><div id="coneSlot"></div><div id="basePositionSlot"></div><div id="holeSlot"></div><div class="group">SECTIONS</div><div id="slicesSlot"></div><div id="gapSlot"></div><div class="group">EDGES</div><div id="bevelSlot"></div><div id="smoothnessSlot"></div></div><div class="group">SHADING</div><div class="shading"><button id="smooth" class="active">Smooth</button><button id="flat">Flat</button></div></div><div id="arrayTab" hidden><div class="group">DISTRIBUTION</div><div class="arrayField"><select id="arrayMode"><option value="single">単体</option><option value="grid">3D配列</option><option value="surface">円柱表面 Scatter</option></select></div><div id="arrayControls"></div><div class="note">Scatterは円柱の側面に配置します。Seedで配置を再現できます。</div></div></section></main>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.169.0';
import {OrbitControls} from 'https://esm.sh/three@0.169.0/examples/jsm/controls/OrbitControls.js';
const host=document.getElementById('viewport'),scene=new THREE.Scene();scene.background=new THREE.Color('#1b212b');
const camera=new THREE.PerspectiveCamera(38,1,.05,100);camera.position.set(4.4,3.3,7);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;host.prepend(renderer.domElement);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.minDistance=2;orbit.maxDistance=25;orbit.update();
scene.add(new THREE.HemisphereLight(0xe5f1ff,0x303746,2.2));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(4,7,5);scene.add(sun);
const grid=new THREE.GridHelper(16,32,0x4c5a71,0x2a3546);grid.position.y=-1.5;scene.add(grid);
const defaults={size:2.5,height:2.5,cone:0,basePosition:0,hole:0,slices:1,gap:0,bevel:0,smoothness:8};
const settings=[['size','直径',.3,5,.05],['height','高さ',.3,5,.05],['cone','円錐化',0,1,.01],['basePosition','底面位置',0,1,.01],['hole','中心の穴',0,1,.01],['slices','分割',1,16,1],['gap','隙間',0,.9,.01],['bevel','ベベル',0,1,.01],['smoothness','滑らかさ',1,24,1]];
let items=[],selected=0,nextId=1,history=[],cursor=-1,activeTab="props";const arrayDefaults={mode:"single",countX:2,countY:2,countZ:2,spacing:0.3,scatter:0,seed:1,surfaceCount:20,surfaceRadius:2,surfaceHeight:2.5};const colors=[0x75b9ff,0xffaa65,0x85dfaa,0xe39aff,0xff7f9a];
function current(){return items.find(x=>x.id===selected)}
function snapshot(){return JSON.stringify({items:items.map(({mesh,...rest})=>rest),selected,nextId})}
function record(){const s=snapshot();if(history[cursor]===s)return;history=history.slice(0,cursor+1);history.push(s);cursor=history.length-1;if(history.length>100){history.shift();cursor--}buttons()}
function buttons(){document.getElementById('undo').disabled=cursor<=0;document.getElementById('redo').disabled=cursor>=history.length-1}
function disposeAll(){for(const x of items)dispose(x)}function dispose(x){if(!x.mesh)return;const disposedG=new Set(),disposedM=new Set();scene.remove(x.mesh);x.mesh.traverse(o=>{if(o.isMesh){if(!disposedG.has(o.geometry)){o.geometry.dispose();disposedG.add(o.geometry)}if(!disposedM.has(o.material)){o.material.dispose();disposedM.add(o.material)}}});x.mesh=null}
function restore(s){disposeAll();const v=JSON.parse(s);items=v.items;selected=v.selected;nextId=v.nextId;for(const x of items){x.array??={...arrayDefaults};x.rotation??={x:0,y:0,z:0};build(x)}renderList();sync();buttons()}
document.getElementById('undo').onclick=()=>{if(cursor>0)restore(history[--cursor])};document.getElementById('redo').onclick=()=>{if(cursor<history.length-1)restore(history[++cursor])};
for(const [key,label,min,max,step] of settings){const slot=document.getElementById(key+'Slot');slot.innerHTML='<div class="row"><label for="'+key+'">'+label+'</label><input id="'+key+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'"><output id="'+key+'Value"></output><button class="mini-reset" id="'+key+'Reset" aria-label="'+label+'をリセット">↺</button></div>';const el=document.getElementById(key);el.addEventListener('input',()=>{const x=current();if(!x)return;x.p[key]=Number(el.value);conflict(x.p,key);sync();build(x)});el.addEventListener('change',record);const resetOne=()=>{const x=current();if(!x)return;x.p[key]=defaults[key];conflict(x.p,key);sync();build(x);record()};document.getElementById(key+'Value').addEventListener('dblclick',resetOne);document.getElementById(key+'Reset').addEventListener('click',resetOne)}
function conflict(p,key){if(key==='cone')p.hole=Math.min(p.hole,1-p.cone);if(key==='hole')p.cone=Math.min(p.cone,1-p.hole)}
function sync(){const x=current();document.getElementById('parameters').style.display=x&&x.type==='cylinder'?'':'none';document.getElementById('smooth').disabled=!x;document.getElementById('flat').disabled=!x;if(!x)return;syncExtra();for(const [key] of settings){document.getElementById(key).value=x.p[key];document.getElementById(key+'Value').textContent=['slices','smoothness'].includes(key)?x.p[key]:x.p[key].toFixed(2)}document.getElementById('flat').classList.toggle('active',x.flat);document.getElementById('smooth').classList.toggle('active',!x.flat)}
function geometry(p){

const g=new THREE.BufferGeometry(),pos=[],norm=[],indices=[];
const R=p.size/2,H=p.height/2,sections=p.slices;
const inner=p.hole,round=p.bevel*Math.min(R,H);
const rows=Math.max(64,p.smoothness*8),N=128;
const eps=1e-7;
function vertex(r,y,a){const id=pos.length/3;pos.push(Math.cos(a)*r,y,Math.sin(a)*r);return id}
function tri(a,b,c){const ax=pos[a*3],ay=pos[a*3+1],az=pos[a*3+2],bx=pos[b*3],by=pos[b*3+1],bz=pos[b*3+2],cx=pos[c*3],cy=pos[c*3+1],cz=pos[c*3+2];const ux=bx-ax,uy=by-ay,uz=bz-az,vx=cx-ax,vy=cy-ay,vz=cz-az;const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;if(nx*nx+ny*ny+nz*nz>eps*eps)indices.push(a,b,c)}
function quad(a,b,c,d){tri(a,b,c);tri(a,c,d)}
function baseRadius(t){const b=p.basePosition;const denom=t<b?Math.max(b,1e-6):Math.max(1-b,1e-6);return Math.max(0,1-p.cone*Math.abs(t-b)/denom)}
function bevelRadius(t){if(round<=eps)return R;const y=-H+2*H*t,flatEnd=H-round;if(Math.abs(y)<=flatEnd)return R;const v=Math.min(round,Math.abs(y)-flatEnd);return R-round+Math.sqrt(Math.max(0,round*round-v*v))}
function outer(t){return Math.max(0,bevelRadius(t)*baseRadius(t))}
function inside(t){return Math.min(R*inner,outer(t))}
for(let s=0;s<sections;s++){
const span=2*Math.PI/sections,trim=span*p.gap/2,a0=s*span+trim,a1=(s+1)*span-trim;
if(a1-a0<1e-5)continue;
const cols=Math.max(4,Math.ceil(N/sections*(1-p.gap))),out=[],inn=[];
for(let j=0;j<=rows;j++){const t=j/rows,y=-H+p.height*t,ro=outer(t),ri=inside(t),oo=[],ii=[];
for(let i=0;i<=cols;i++){const a=a0+(a1-a0)*i/cols;oo.push(vertex(ro,y,a));ii.push(vertex(ri,y,a))}
out.push(oo);inn.push(ii)}
for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
quad(out[j][i],out[j][i+1],out[j+1][i+1],out[j+1][i]);
if(inner>0)quad(inn[j][i+1],inn[j][i],inn[j+1][i],inn[j+1][i+1])
}
for(const j of [0,rows])for(let i=0;i<cols;i++){
if(j===0)quad(inn[j][i],inn[j][i+1],out[j][i+1],out[j][i]);
else quad(out[j][i],out[j][i+1],inn[j][i+1],inn[j][i])
}
if(sections>1||p.gap>0)for(const i of [0,cols])for(let j=0;j<rows;j++){
if(i===0)quad(inn[j][i],out[j][i],out[j+1][i],inn[j+1][i]);
else quad(out[j][i],inn[j][i],inn[j+1][i],out[j+1][i])
}
}
g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
g.setIndex(indices);

g.computeVertexNormals();
return g

}
function build(x){
dispose(x);
const base=x.type==='cylinder'?geometry(x.p):x.type==='box'?new THREE.BoxGeometry(2,2,2):new THREE.SphereGeometry(1.25,64,48);
const material=new THREE.MeshStandardMaterial({color:colors[x.colorIndex%colors.length],metalness:.24,roughness:.37,side:THREE.DoubleSide,flatShading:x.flat});
const group=new THREE.Group(),a=x.array||arrayDefaults,rot=x.rotation||{x:0,y:0,z:0};
const rng=(()=>{let v=(Math.floor(a.seed)||1)>>>0;return()=>{v=(Math.imul(v,1664525)+1013904223)>>>0;return v/4294967296}})();
function instance(px,py,pz,rx=0,ry=0,rz=0){const m=new THREE.Mesh(base,material);m.position.set(px,py,pz);m.rotation.set(rx,ry,rz);group.add(m)}
if(a.mode==='grid'){
const nx=a.countX,ny=a.countY,nz=a.countZ,d=2+a.spacing;
for(let ix=0;ix<nx;ix++)for(let iy=0;iy<ny;iy++)for(let iz=0;iz<nz;iz++){
const j=a.scatter;instance((ix-(nx-1)/2)*d+(rng()-.5)*j,(iy-(ny-1)/2)*d+(rng()-.5)*j,(iz-(nz-1)/2)*d+(rng()-.5)*j)}
}else if(a.mode==='surface'){
for(let i=0;i<a.surfaceCount;i++){const angle=2*Math.PI*(i/a.surfaceCount+(rng()-.5)*a.scatter/a.surfaceCount*2),h=((i+.5)/a.surfaceCount-.5)*a.surfaceHeight+(rng()-.5)*a.scatter*a.surfaceHeight/a.surfaceCount*2;
instance(Math.cos(angle)*a.surfaceRadius,h,Math.sin(angle)*a.surfaceRadius,0,-angle,0)}
}else instance(0,0,0);
group.rotation.set(rot.x*Math.PI/180,rot.y*Math.PI/180,rot.z*Math.PI/180);
x.mesh=group;scene.add(group)
}
function renderList(){const el=document.getElementById('objects');el.replaceChildren();for(const x of items){const row=document.createElement('div');row.className='object'+(x.id===selected?' selected':'');const name=document.createElement('span');name.className='name';name.textContent=x.name;const dot=document.createElement('span');dot.style.cssText='display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;background:#'+colors[x.colorIndex%colors.length].toString(16).padStart(6,'0');row.append(dot,name);row.addEventListener('click',()=>{selected=x.id;renderList();sync();record()});el.append(row)}document.getElementById("add").disabled=items.length>=5}
function add(type){if(items.length>=5)return;const used=new Set(items.map(x=>x.colorIndex));const colorIndex=[0,1,2,3,4].find(i=>!used.has(i));const id=nextId++;const labels={cylinder:'円柱（パラメトリック）',box:'立方体',sphere:'球体'};const x={id,name:labels[type]+' '+id,type,p:{...defaults},flat:false,colorIndex,array:{...arrayDefaults},rotation:{x:0,y:0,z:0}};items.push(x);selected=id;build(x);renderList();sync();record()}
document.getElementById('add').onclick=()=>add(document.getElementById('addType').value);
document.getElementById('reset').onclick=()=>{const x=current();if(!x)return;x.p={...defaults};x.flat=false;x.rotation={x:0,y:0,z:0};x.array={...arrayDefaults};build(x);sync();record()};
for(const [id,v] of [['flat',true],['smooth',false]])document.getElementById(id).onclick=()=>{const x=current();if(!x)return;x.flat=v;build(x);sync();record()};
const fields=[['countX','X個数',1,5,1],['countY','Y個数',1,5,1],['countZ','Z個数',1,5,1],['spacing','隙間',0,5,.05],['scatter','Scatter',0,1,.01],['seed','Seed',1,9999,1],['surfaceCount','配置数',1,100,1],['surfaceRadius','配置半径',.2,5,.05],['surfaceHeight','配置高さ',.2,5,.05]];
for(const [axis,label] of [['x','回転 X'],['y','回転 Y'],['z','回転 Z']]){const holder=document.createElement('div');holder.className='arrayField';holder.innerHTML='<label>'+label+'</label><input type="range" min="-180" max="180" step="1"><output>0°</output><button class="mini-reset">↺</button>';document.getElementById('parameters').append(holder);const input=holder.querySelector('input'),out=holder.querySelector('output');input.dataset.rotation=axis;input.addEventListener('input',()=>{const x=current();if(!x)return;x.rotation[axis]=Number(input.value);out.textContent=input.value+'°';build(x)});input.addEventListener('change',record);holder.querySelector('button').onclick=()=>{const x=current();if(!x)return;x.rotation[axis]=0;syncExtra();build(x);record()}}
for(const [key,label,min,max,step] of fields){const holder=document.createElement('div');holder.className='arrayField';holder.dataset.field=key;holder.innerHTML='<label>'+label+'</label><input type="range" min="'+min+'" max="'+max+'" step="'+step+'"><output></output><button class="mini-reset">↺</button>';document.getElementById('arrayControls').append(holder);const input=holder.querySelector('input');input.addEventListener('input',()=>{const x=current();if(!x)return;x.array[key]=Number(input.value);syncExtra();build(x)});input.addEventListener('change',record);holder.querySelector('button').onclick=()=>{const x=current();if(!x)return;x.array[key]=arrayDefaults[key];syncExtra();build(x);record()}}
document.getElementById('arrayMode').onchange=e=>{const x=current();if(!x)return;x.array.mode=e.target.value;syncExtra();build(x);record()};
function syncExtra(){const x=current();if(!x)return;document.getElementById('arrayMode').value=x.array.mode;for(const [key] of fields){const holder=document.querySelector('[data-field="'+key+'"]');holder.querySelector('input').value=x.array[key];holder.querySelector('output').textContent=x.array[key];holder.style.display=x.array.mode==='single'?'none':x.array.mode==='grid'?(key.startsWith('surface')?'none':'flex'):(['countX','countY','countZ','spacing'].includes(key)?'none':'flex')}for(const axis of ['x','y','z']){const input=document.querySelector('[data-rotation="'+axis+'"]');input.value=x.rotation[axis];input.nextElementSibling.textContent=x.rotation[axis]+'°'}}
function tab(t){activeTab=t;document.getElementById('propertiesTab').hidden=t!=='props';document.getElementById('arrayTab').hidden=t!=='array';document.getElementById('tabProps').classList.toggle('active',t==='props');document.getElementById('tabArray').classList.toggle('active',t==='array')}
document.getElementById('tabProps').onclick=()=>tab('props');document.getElementById('tabArray').onclick=()=>tab('array');
const workspace=document.getElementById('workspace'),handle=document.getElementById('dividerHandle');let dragging=false;handle.addEventListener('pointerdown',e=>{dragging=true;handle.setPointerCapture(e.pointerId);e.preventDefault()});handle.addEventListener('pointermove',e=>{if(!dragging)return;const rect=workspace.getBoundingClientRect();const percentage=Math.max(18,Math.min(82,(e.clientX-rect.left)/rect.width*100));workspace.style.setProperty('--split',percentage+'%')});handle.addEventListener('pointerup',()=>dragging=false);handle.addEventListener('pointercancel',()=>dragging=false);
new ResizeObserver(()=>{renderer.setSize(host.clientWidth,host.clientHeight);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix()}).observe(host);
add('cylinder');function frame(){requestAnimationFrame(frame);orbit.update();renderer.render(scene,camera)}frame();
</script></body></html>
