<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Three.js GLB Scene</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

#viewport {
  position: relative;
  background: #111;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* UI */
#ui {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 10;

  display: flex;
  flex-direction: column;
  gap: 8px;

  width: 170px;
}

.fileButton {
  display: block;

  padding: 10px 12px;

  background: rgba(20,20,20,0.85);
  border: 1px solid #555;
  border-radius: 8px;

  color: white;
  font-size: 13px;

  text-align: center;
}

.fileButton input {
  display: none;
}

#status {
  color: #aaa;
  font-size: 11px;
  padding: 4px;
}
</style>
</head>

<body>

<div id="viewport">

  <div id="ui">

    <label class="fileButton">
      Object 1
      <input type="file"
             class="glbInput"
             accept=".glb">
    </label>

    <label class="fileButton">
      Object 2
      <input type="file"
             class="glbInput"
             accept=".glb">
    </label>

    <label class="fileButton">
      Object 3
      <input type="file"
             class="glbInput"
             accept=".glb">
    </label>

    <label class="fileButton">
      Object 4
      <input type="file"
             class="glbInput"
             accept=".glb">
    </label>

    <div id="status">
      GLBを選択してください
    </div>

  </div>

</div>


<script type="importmap">
{
  "imports": {
    "three":
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

    "three/addons/":
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>


<script type="module">

import * as THREE from 'three';

import {
  GLTFLoader
} from 'three/addons/loaders/GLTFLoader.js';

import {
  OrbitControls
} from 'three/addons/controls/OrbitControls.js';


/* =========================
   SETTINGS
========================= */

const TARGET_WIDTH = 1920;
const TARGET_HEIGHT = 840;

const ASPECT =
  TARGET_WIDTH / TARGET_HEIGHT;


/* =========================
   HTML
========================= */

const viewport =
  document.getElementById('viewport');

const status =
  document.getElementById('status');


/* =========================
   SCENE
========================= */

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0x101010);


/* =========================
   CAMERA
========================= */

const camera =
  new THREE.PerspectiveCamera(
    50,
    ASPECT,
    0.01,
    10000
  );

camera.position.set(
  5,
  3,
  8
);


/* =========================
   RENDERER
========================= */

const renderer =
  new THREE.WebGLRenderer({
    antialias: true
  });

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;

viewport.appendChild(
  renderer.domElement
);


/* =========================
   CONTROLS
========================= */

const controls =
  new OrbitControls(
    camera,
    renderer.domElement
  );

controls.enableDamping = true;

controls.dampingFactor = 0.06;


/* =========================
   LIGHTS
========================= */

const hemisphere =
  new THREE.HemisphereLight(
    0xffffff,
    0x222222,
    2
  );

scene.add(hemisphere);


const keyLight =
  new THREE.DirectionalLight(
    0xffffff,
    4
  );

keyLight.position.set(
  5,
  8,
  5
);

keyLight.castShadow = true;

scene.add(keyLight);


const fillLight =
  new THREE.DirectionalLight(
    0xffffff,
    2
  );

fillLight.position.set(
  -5,
  3,
  -3
);

scene.add(fillLight);


/* =========================
   FLOOR
========================= */

const floor =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      100,
      100
    ),

    new THREE.MeshStandardMaterial({
      color: 0x222222,
      roughness: 0.9
    })
  );

floor.rotation.x =
  -Math.PI / 2;

floor.position.y = -1;

floor.receiveShadow = true;

scene.add(floor);


/* =========================
   OBJECT SLOTS
========================= */

const objects = [
  null,
  null,
  null,
  null
];

const loader =
  new GLTFLoader();


/* =========================
   FILE INPUT
========================= */

const inputs =
  document.querySelectorAll(
    '.glbInput'
  );


inputs.forEach(
  (input, index) => {

    input.addEventListener(
      'change',

      async (event) => {

        const file =
          event.target.files[0];

        if (!file) return;


        status.textContent =
          `Object ${index + 1} 読み込み中…`;


        try {

          const url =
            URL.createObjectURL(file);


          loader.load(

            url,

            (gltf) => {

              /* 古いオブジェクト削除 */

              if (objects[index]) {

                scene.remove(
                  objects[index]
                );

              }


              const model =
                gltf.scene;


              /* Shadow */

              model.traverse(
                (child) => {

                  if (child.isMesh) {

                    child.castShadow = true;

                    child.receiveShadow = true;

                  }

                }
              );


              /* 配置 */

              model.position.set(
                index * 2.5 - 3.75,
                0,
                0
              );


              scene.add(model);

              objects[index] =
                model;


              URL.revokeObjectURL(
                url
              );


              fitCameraToObjects();


              status.textContent =
                `${file.name} 読み込み完了`;

            },


            undefined,


            (error) => {

              console.error(error);

              URL.revokeObjectURL(
                url
              );

              status.textContent =
                `Object ${index + 1} 読み込み失敗`;

            }

          );

        }

        catch(error) {

          console.error(error);

          status.textContent =
            'エラーが発生しました';

        }

      }

    );

  }
);


/* =========================
   CAMERA AUTO FIT
========================= */

function fitCameraToObjects() {

  const loaded =
    objects.filter(
      object => object !== null
    );

  if (
    loaded.length === 0
  ) return;


  const box =
    new THREE.Box3();


  loaded.forEach(
    object => {

      box.expandByObject(
        object
      );

    }
  );


  const size =
    box.getSize(
      new THREE.Vector3()
    );

  const center =
    box.getCenter(
      new THREE.Vector3()
    );


  const maxSize =
    Math.max(
      size.x,
      size.y,
      size.z
    );


  const fov =
    camera.fov *
    Math.PI /
    180;


  let distance =
    maxSize /
    (2 * Math.tan(
      fov / 2
    ));


  distance *= 1.6;


  camera.position.set(
    center.x,
    center.y +
      distance * 0.25,

    center.z +
      distance
  );


  camera.near =
    Math.max(
      distance / 1000,
      0.001
    );

  camera.far =
    distance * 100;


  camera.updateProjectionMatrix();


  controls.target.copy(
    center
  );

  controls.update();

}


/* =========================
   1920 × 840
========================= */

function resizeViewport() {

  const screenWidth =
    window.innerWidth;

  const screenHeight =
    window.innerHeight;


  let width;
  let height;


  if (
    screenWidth /
    screenHeight >
    ASPECT
  ) {

    height =
      screenHeight;

    width =
      height * ASPECT;

  }

  else {

    width =
      screenWidth;

    height =
      width / ASPECT;

  }


  viewport.style.width =
    width + 'px';

  viewport.style.height =
    height + 'px';


  renderer.setSize(
    width,
    height,
    false
  );


  camera.aspect =
    ASPECT;

  camera.updateProjectionMatrix();

}


window.addEventListener(
  'resize',
  resizeViewport
);

resizeViewport();


/* =========================
   ANIMATION
========================= */

function animate() {

  requestAnimationFrame(
    animate
  );


  controls.update();


  renderer.render(
    scene,
    camera
  );

}


animate();

</script>

</body>
</html>
