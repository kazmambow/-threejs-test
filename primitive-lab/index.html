<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Primitive Lab v0.2</title><style>
*{box-sizing:border-box}body{margin:0;background:#11141b;color:#e8edf6;font:11px -apple-system,BlinkMacSystemFont,sans-serif}header{height:35px;display:flex;align-items:center;justify-content:space-between;padding:0 11px;border-bottom:1px solid #303746}header b{font-size:12px;letter-spacing:.06em}.actions{display:flex;gap:5px}button,select{border:1px solid #3a4659;background:#222b38;color:#dce7f7;border-radius:5px;padding:5px 8px;font:inherit}button:disabled{opacity:.3}button.active{background:#2d5887;border-color:#6b9bca}#viewport{height:43dvh;min-height:225px;background:#1b212b;position:relative;touch-action:none}#viewport canvas{display:block}.hint{position:absolute;bottom:7px;left:9px;color:#8f9db0;font-size:9px;pointer-events:none}main{height:calc(100dvh - 35px - 43dvh);overflow:auto;padding:7px 10px 24px}.row{display:flex;align-items:center;gap:8px;margin:5px 0}.row label{width:90px;flex:none;color:#b7c5d9}.row input{flex:1;min-width:0;accent-color:#78aefe;height:15px}.row output{width:39px;text-align:right;color:#9cc5ff;font-variant-numeric:tabular-nums;touch-action:manipulation;user-select:none;padding:5px 0}.group{font-size:10px;color:#748ca8;margin:10px 0 5px;border-bottom:1px solid #293444;padding-bottom:3px}.toolbar{display:flex;gap:6px;align-items:center}.toolbar select{flex:1}.shading{display:flex;gap:5px}.shading button{flex:1}.note{color:#78899f;font-size:9px;line-height:1.4;margin-top:8px}</style></head><body><header><b>PRIMITIVE LAB <small style="color:#83b6f5">v0.2</small></b><div class="actions"><button id="undo">↶ Undo</button><button id="redo">↷ Redo</button><button id="reset">Reset</button></div></header><div id="viewport"><span class="hint">1本指: 回転 / 2本指: 移動・ズーム</span></div><main><div class="toolbar"><select id="primitive"><option value="cylinder">円柱（パラメトリック）</option><option value="box">立方体</option><option value="sphere">球体</option></select></div><div id="parameters"><div class="group">DIMENSIONS</div><div id="sizeSlot"></div><div id="heightSlot"></div><div class="group">PROFILE</div><div id="coneSlot"></div><div id="basePositionSlot"></div><div id="holeSlot"></div><div class="group">SECTIONS</div><div id="slicesSlot"></div><div id="gapSlot"></div><div class="group">EDGES</div><div id="bevelSlot"></div><div id="smoothnessSlot"></div></div><div class="group">SHADING</div><div class="shading"><button id="smooth" class="active">Smooth</button><button id="flat">Flat</button></div><p class="note">数値をダブルタップ：その項目を初期化。円錐化と穴は後から操作した項目を優先します。ベベル最大で縦横比1:1の円柱は球体になります。</p></main>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.169.0';
import {OrbitControls} from 'https://esm.sh/three@0.169.0/examples/jsm/controls/OrbitControls.js';
const host=document.getElementById('viewport'),scene=new THREE.Scene();scene.background=new THREE.Color('#1b212b');
const camera=new THREE.PerspectiveCamera(38,1,.05,100);camera.position.set(4.4,3.3,6);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;host.prepend(renderer.domElement);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.minDistance=2;orbit.maxDistance=20;orbit.update();
scene.add(new THREE.HemisphereLight(0xe5f1ff,0x303746,2.2));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(4,7,5);scene.add(sun);
const grid=new THREE.GridHelper(12,24,0x4c5a71,0x2a3546);grid.position.y=-1.5;scene.add(grid);
const defaults={size:2.5,height:2.5,cone:0,basePosition:0,hole:0,slices:1,gap:0,bevel:0,smoothness:8};let p={...defaults},flat=false,mesh;
const settings=[['size','直径',.3,5,.05],['height','高さ',.3,5,.05],['cone','円錐化',0,1,.01],['basePosition','底面位置',0,1,.01],['hole','中心の穴',0,1,.01],['slices','ケーキ分割',1,16,1],['gap','分割の隙間',0,.9,.01],['bevel','ベベル',0,1,.01],['smoothness','滑らかさ',1,24,1]];
let history=[],cursor=-1,dragStart=null;
function snapshot(){return JSON.stringify({p,flat,type:document.getElementById('primitive').value})}
function record(){const s=snapshot();if(history[cursor]===s)return;history=history.slice(0,cursor+1);history.push(s);cursor=history.length-1;if(history.length>100){history.shift();cursor--}buttons()}
function buttons(){document.getElementById('undo').disabled=cursor<=0;document.getElementById('redo').disabled=cursor>=history.length-1}
function restore(s){const v=JSON.parse(s);p=v.p;flat=v.flat;document.getElementById('primitive').value=v.type;sync();build();shading();buttons()}
document.getElementById('undo').onclick=()=>{if(cursor>0)restore(history[--cursor])};document.getElementById('redo').onclick=()=>{if(cursor<history.length-1)restore(history[++cursor])};
for(const [key,label,min,max,step] of settings){const slot=document.getElementById(key+'Slot');slot.innerHTML='<div class="row"><label for="'+key+'">'+label+'</label><input id="'+key+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'"><output id="'+key+'Value" title="ダブルタップで初期化"></output></div>';const el=document.getElementById(key);el.addEventListener('pointerdown',()=>dragStart=snapshot());el.addEventListener('input',()=>{p[key]=Number(el.value);conflict(key);sync();build()});el.addEventListener('change',record);document.getElementById(key+'Value').addEventListener('dblclick',()=>{p[key]=defaults[key];conflict(key);sync();build();record()})}
function conflict(key){if(key==='cone')p.hole=Math.min(p.hole,1-p.cone);if(key==='hole')p.cone=Math.min(p.cone,1-p.hole)}
function sync(){for(const [key] of settings){document.getElementById(key).value=p[key];document.getElementById(key+'Value').textContent=['slices','smoothness'].includes(key)?p[key]:p[key].toFixed(2)}}
function geometry(){const g=new THREE.BufferGeometry(),pos=[],uv=[],indices=[];const N=128,H=p.height/2,R=p.size/2,inner=p.hole*(1-p.cone),count=p.slices,round=p.bevel,rows=Math.max(48,p.smoothness*6);
function point(r,y,a){return [Math.cos(a)*r*R,y,Math.sin(a)*r*R]}
function vert(r,y,a){const v=point(r,y,a);pos.push(...v);uv.push(a/(2*Math.PI),y/p.height+.5);return pos.length/3-1}
function quad(a,b,c,d,reverse=false){if(reverse)indices.push(a,c,b,a,d,c);else indices.push(a,b,c,a,c,d)}
function outer(t){const y=t*2-1,base=p.basePosition*2-1,coneRadius=p.cone===0?1:Math.max(0,1-p.cone*Math.abs(y-base)/(y<base?Math.max(.00001,base+1):Math.max(.00001,1-base)));const sphere=Math.sqrt(Math.max(0,1-y*y));return Math.max(0,coneRadius*((1-round)+round*sphere))}
for(let s=0;s<count;s++){const sector=2*Math.PI/count,trim=sector*p.gap/2,a0=s*sector+trim,a1=(s+1)*sector-trim;if(a1-a0<.00001)continue;const cols=Math.max(5,Math.ceil(N/count*(1-p.gap))),outerGrid=[],innerGrid=[];
for(let j=0;j<=rows;j++){const t=j/rows,y=-H+t*p.height,r=outer(t);const ro=[],ri=[];for(let i=0;i<=cols;i++){const a=a0+(a1-a0)*i/cols;ro.push(vert(r,y,a));ri.push(vert(Math.min(inner,r),y,a))}outerGrid.push(ro);innerGrid.push(ri)}
for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){quad(outerGrid[j][i],outerGrid[j][i+1],outerGrid[j+1][i+1],outerGrid[j+1][i]);if(inner>0)quad(innerGrid[j][i+1],innerGrid[j][i],innerGrid[j+1][i],innerGrid[j+1][i+1])}
for(const j of [0,rows])for(let i=0;i<cols;i++){if(j===0)quad(innerGrid[j][i],innerGrid[j][i+1],outerGrid[j][i+1],outerGrid[j][i]);else quad(outerGrid[j][i],outerGrid[j][i+1],innerGrid[j][i+1],innerGrid[j][i])}
if(count>1||p.gap>0)for(const i of [0,cols])for(let j=0;j<rows;j++){if(i===0)quad(innerGrid[j][i],outerGrid[j][i],outerGrid[j+1][i],innerGrid[j+1][i]);else quad(outerGrid[j][i],innerGrid[j][i],innerGrid[j+1][i],outerGrid[j+1][i])}
}
g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(indices);g.computeVertexNormals();return g}
function build(){if(mesh){scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose()}const type=document.getElementById('primitive').value;let g=type==='cylinder'?geometry():type==='box'?new THREE.BoxGeometry(2,2,2):new THREE.SphereGeometry(1.25,64,48);const material=new THREE.MeshStandardMaterial({color:0x8bb9e9,metalness:.24,roughness:.37,side:THREE.DoubleSide,flatShading:flat});mesh=new THREE.Mesh(g,material);scene.add(mesh);document.getElementById('parameters').style.display=type==='cylinder'?'':'none'}
function shading(){document.getElementById('flat').classList.toggle('active',flat);document.getElementById('smooth').classList.toggle('active',!flat)}
document.getElementById('primitive').onchange=()=>{build();record()};document.getElementById('reset').onclick=()=>{p={...defaults};flat=false;sync();shading();build();record()};for(const [id,v] of [['flat',true],['smooth',false]])document.getElementById(id).onclick=()=>{flat=v;shading();build();record()};
new ResizeObserver(()=>{renderer.setSize(host.clientWidth,host.clientHeight);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix()}).observe(host);
sync();build();record();function frame(){requestAnimationFrame(frame);orbit.update();renderer.render(scene,camera)}frame();
</script></body></html>
