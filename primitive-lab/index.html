<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Primitive Lab v0.4</title><style>
*{box-sizing:border-box}body{margin:0;background:#11141b;color:#e8edf6;font:10px -apple-system,BlinkMacSystemFont,sans-serif}header{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 9px;border-bottom:1px solid #303746}header b{font-size:11px}.actions{display:flex;gap:4px}button,select{border:1px solid #3a4659;background:#222b38;color:#dce7f7;border-radius:5px;padding:4px;font:inherit}button:disabled{opacity:.3}button.active{background:#2d5887;border-color:#6b9bca}#viewport{height:43dvh;min-height:225px;background:#1b212b;position:relative;touch-action:none}.hint{position:absolute;bottom:7px;left:9px;color:#8f9db0;font-size:9px;pointer-events:none}main{height:calc(100dvh - 30px - 43dvh);display:grid;grid-template-columns:1fr 1fr;overflow:hidden}.panel{min-width:0;overflow:auto;padding:6px 5px 20px}.panel+.panel{border-left:1px solid #354153}.panelTitle{color:#9bb1d1;font-size:10px;margin:2px 0 8px}.row{display:flex;align-items:center;gap:2px;margin:2px 0}.row label{width:54px;flex:none;color:#b7c5d9;font-size:9px}.row input{flex:1;min-width:0;accent-color:#78aefe;height:13px}.row output{width:26px;text-align:right;color:#9cc5ff;font-variant-numeric:tabular-nums;user-select:none;font-size:9px}.group{font-size:9px;color:#748ca8;margin:7px 0 3px;border-bottom:1px solid #293444;padding-bottom:2px}.shading{display:flex;gap:4px}.shading button{flex:1}.mini-reset{padding:1px 2px;min-width:16px;color:#a7bbd7;background:transparent;border-color:#303c4e}.object{display:flex;align-items:center;gap:3px;padding:7px 4px;border:1px solid #303c4e;border-radius:5px;margin:3px 0;cursor:pointer}.object.selected{background:#2a4c70;border-color:#6894c3}.object .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.addbar{display:flex;gap:4px;margin:7px 0}.addbar select{min-width:0;flex:1}.addbar button{white-space:nowrap;background:#315b86}.empty{color:#8798af;font-size:9px}.note{color:#78899f;font-size:9px;line-height:1.4;margin-top:8px}</style></head><body><header><b>PRIMITIVE LAB <span style="color:#83b6f5">v0.4</span></b><div class="actions"><button id="undo">↶ Undo</button><button id="redo">↷ Redo</button><button id="reset">Reset</button></div></header><div id="viewport"><span class="hint">1本指: 回転 / 2本指: 移動・ズーム</span></div><main><section class="panel"><div class="panelTitle">PROPERTIES</div><div id="parameters"><div class="group">DIMENSIONS</div><div id="sizeSlot"></div><div id="heightSlot"></div><div class="group">PROFILE</div><div id="coneSlot"></div><div id="basePositionSlot"></div><div id="holeSlot"></div><div class="group">SECTIONS</div><div id="slicesSlot"></div><div id="gapSlot"></div><div class="group">EDGES</div><div id="bevelSlot"></div><div id="smoothnessSlot"></div></div><div class="group">SHADING</div><div class="shading"><button id="smooth" class="active">Smooth</button><button id="flat">Flat</button></div></section><section class="panel"><div class="panelTitle">SCENE OBJECTS</div><div id="objects"></div><div class="addbar"><select id="addType"><option value="cylinder">円柱（パラメトリック）</option><option value="box">立方体</option><option value="sphere">球体</option></select><button id="add">＋追加</button></div><p class="note">一覧からオブジェクトを選択すると左側の設定が切り替わります。</p></section></main>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.169.0';
import {OrbitControls} from 'https://esm.sh/three@0.169.0/examples/jsm/controls/OrbitControls.js';
const host=document.getElementById('viewport'),scene=new THREE.Scene();scene.background=new THREE.Color('#1b212b');
const camera=new THREE.PerspectiveCamera(38,1,.05,100);camera.position.set(4.4,3.3,7);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;host.prepend(renderer.domElement);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.minDistance=2;orbit.maxDistance=25;orbit.update();
scene.add(new THREE.HemisphereLight(0xe5f1ff,0x303746,2.2));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(4,7,5);scene.add(sun);
const grid=new THREE.GridHelper(16,32,0x4c5a71,0x2a3546);grid.position.y=-1.5;scene.add(grid);
const defaults={size:2.5,height:2.5,cone:0,basePosition:0,hole:0,slices:1,gap:0,bevel:0,smoothness:8};
const settings=[['size','直径',.3,5,.05],['height','高さ',.3,5,.05],['cone','円錐化',0,1,.01],['basePosition','底面位置',0,1,.01],['hole','中心の穴',0,1,.01],['slices','分割',1,16,1],['gap','隙間',0,.9,.01],['bevel','ベベル',0,1,.01],['smoothness','滑らかさ',1,24,1]];
let items=[],selected=0,nextId=1,history=[],cursor=-1;
function current(){return items.find(x=>x.id===selected)}
function snapshot(){return JSON.stringify({items:items.map(({mesh,...rest})=>rest),selected,nextId})}
function record(){const s=snapshot();if(history[cursor]===s)return;history=history.slice(0,cursor+1);history.push(s);cursor=history.length-1;if(history.length>100){history.shift();cursor--}buttons()}
function buttons(){document.getElementById('undo').disabled=cursor<=0;document.getElementById('redo').disabled=cursor>=history.length-1}
function disposeAll(){for(const x of items)if(x.mesh){scene.remove(x.mesh);x.mesh.geometry.dispose();x.mesh.material.dispose()}}
function restore(s){disposeAll();const v=JSON.parse(s);items=v.items;selected=v.selected;nextId=v.nextId;for(const x of items)build(x);renderList();sync();buttons()}
document.getElementById('undo').onclick=()=>{if(cursor>0)restore(history[--cursor])};document.getElementById('redo').onclick=()=>{if(cursor<history.length-1)restore(history[++cursor])};
for(const [key,label,min,max,step] of settings){const slot=document.getElementById(key+'Slot');slot.innerHTML='<div class="row"><label for="'+key+'">'+label+'</label><input id="'+key+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'"><output id="'+key+'Value"></output><button class="mini-reset" id="'+key+'Reset" aria-label="'+label+'をリセット">↺</button></div>';const el=document.getElementById(key);el.addEventListener('input',()=>{const x=current();if(!x)return;x.p[key]=Number(el.value);conflict(x.p,key);sync();build(x)});el.addEventListener('change',record);const resetOne=()=>{const x=current();if(!x)return;x.p[key]=defaults[key];conflict(x.p,key);sync();build(x);record()};document.getElementById(key+'Value').addEventListener('dblclick',resetOne);document.getElementById(key+'Reset').addEventListener('click',resetOne)}
function conflict(p,key){if(key==='cone')p.hole=Math.min(p.hole,1-p.cone);if(key==='hole')p.cone=Math.min(p.cone,1-p.hole)}
function sync(){const x=current();document.getElementById('parameters').style.display=x&&x.type==='cylinder'?'':'none';document.getElementById('smooth').disabled=!x;document.getElementById('flat').disabled=!x;if(!x)return;for(const [key] of settings){document.getElementById(key).value=x.p[key];document.getElementById(key+'Value').textContent=['slices','smoothness'].includes(key)?x.p[key]:x.p[key].toFixed(2)}document.getElementById('flat').classList.toggle('active',x.flat);document.getElementById('smooth').classList.toggle('active',!x.flat)}
function geometry(p){

const g=new THREE.BufferGeometry(),pos=[],norm=[],indices=[];
const R=p.size/2,H=p.height/2,sections=p.slices;
const inner=p.hole,round=p.bevel*Math.min(R,H);
const rows=Math.max(64,p.smoothness*8),N=128;
const eps=1e-7;
function vertex(r,y,a){const id=pos.length/3;pos.push(Math.cos(a)*r,y,Math.sin(a)*r);return id}
function tri(a,b,c){const ax=pos[a*3],ay=pos[a*3+1],az=pos[a*3+2],bx=pos[b*3],by=pos[b*3+1],bz=pos[b*3+2],cx=pos[c*3],cy=pos[c*3+1],cz=pos[c*3+2];const ux=bx-ax,uy=by-ay,uz=bz-az,vx=cx-ax,vy=cy-ay,vz=cz-az;const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;if(nx*nx+ny*ny+nz*nz>eps*eps)indices.push(a,b,c)}
function quad(a,b,c,d){tri(a,b,c);tri(a,c,d)}
function baseRadius(t){const b=p.basePosition;const denom=t<b?Math.max(b,1e-6):Math.max(1-b,1e-6);return Math.max(0,1-p.cone*Math.abs(t-b)/denom)}
function bevelRadius(t){if(round<=eps)return R;const y=-H+2*H*t,flatEnd=H-round;if(Math.abs(y)<=flatEnd)return R;const v=Math.min(round,Math.abs(y)-flatEnd);return R-round+Math.sqrt(Math.max(0,round*round-v*v))}
function outer(t){return Math.max(0,bevelRadius(t)*baseRadius(t))}
function inside(t){return Math.min(R*inner,outer(t))}
for(let s=0;s<sections;s++){
const span=2*Math.PI/sections,trim=span*p.gap/2,a0=s*span+trim,a1=(s+1)*span-trim;
if(a1-a0<1e-5)continue;
const cols=Math.max(4,Math.ceil(N/sections*(1-p.gap))),out=[],inn=[];
for(let j=0;j<=rows;j++){const t=j/rows,y=-H+p.height*t,ro=outer(t),ri=inside(t),oo=[],ii=[];
for(let i=0;i<=cols;i++){const a=a0+(a1-a0)*i/cols;oo.push(vertex(ro,y,a));ii.push(vertex(ri,y,a))}
out.push(oo);inn.push(ii)}
for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
quad(out[j][i],out[j][i+1],out[j+1][i+1],out[j+1][i]);
if(inner>0)quad(inn[j][i+1],inn[j][i],inn[j+1][i],inn[j+1][i+1])
}
for(const j of [0,rows])for(let i=0;i<cols;i++){
if(j===0)quad(inn[j][i],inn[j][i+1],out[j][i+1],out[j][i]);
else quad(out[j][i],out[j][i+1],inn[j][i+1],inn[j][i])
}
if(sections>1||p.gap>0)for(const i of [0,cols])for(let j=0;j<rows;j++){
if(i===0)quad(inn[j][i],out[j][i],out[j+1][i],inn[j+1][i]);
else quad(out[j][i],inn[j][i],inn[j+1][i],out[j+1][i])
}
}
g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
g.setIndex(indices);

g.computeVertexNormals();
return g

}
function build(x){if(x.mesh){scene.remove(x.mesh);x.mesh.geometry.dispose();x.mesh.material.dispose()}let g=x.type==='cylinder'?geometry(x.p):x.type==='box'?new THREE.BoxGeometry(2,2,2):new THREE.SphereGeometry(1.25,64,48);const mat=new THREE.MeshStandardMaterial({color:0x8bb9e9,metalness:.24,roughness:.37,side:THREE.DoubleSide,flatShading:x.flat});x.mesh=new THREE.Mesh(g,mat);x.mesh.position.x=x.offset;scene.add(x.mesh)}
function renderList(){const el=document.getElementById('objects');el.replaceChildren();for(const x of items){const row=document.createElement('div');row.className='object'+(x.id===selected?' selected':'');const name=document.createElement('span');name.className='name';name.textContent=x.name;row.append(name);row.addEventListener('click',()=>{selected=x.id;renderList();sync();record()});el.append(row)}}
function add(type){const id=nextId++;const labels={cylinder:'円柱（パラメトリック）',box:'立方体',sphere:'球体'};const x={id,name:labels[type]+' '+id,type,p:{...defaults},flat:false,offset:items.length===0?0:(items.length%2?1:-1)*Math.ceil(items.length/2)*2.9};items.push(x);selected=id;build(x);renderList();sync();record()}
document.getElementById('add').onclick=()=>add(document.getElementById('addType').value);
document.getElementById('reset').onclick=()=>{const x=current();if(!x)return;x.p={...defaults};x.flat=false;build(x);sync();record()};
for(const [id,v] of [['flat',true],['smooth',false]])document.getElementById(id).onclick=()=>{const x=current();if(!x)return;x.flat=v;build(x);sync();record()};
new ResizeObserver(()=>{renderer.setSize(host.clientWidth,host.clientHeight);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix()}).observe(host);
add('cylinder');function frame(){requestAnimationFrame(frame);orbit.update();renderer.render(scene,camera)}frame();
</script></body></html>
