scene.add(new THREE.HemisphereLight(0xe5f1ff,0x303746,2.2));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(4,7,5);scene.add(sun);

let selectedMaterial=null;let items=[],selected=0,nextId=1,history=[],cursor=-1,activeTab="props",folders=[],nextFolderId=1,soloId=null,activeChannel=1;const channelArrays={};const arrayDefaults={mode:"single",countX:2,countY:2,countZ:2,spacing:0.3,scatter:0,seed:1,sizeRandom:0,surfaceCount:20,surfaceRadius:2,surfaceHeight:2.5,rotationX:0,rotationY:0,rotationZ:0,randomRotation:0};const colors=[0x75b9ff,0xffaa65,0x85dfaa,0xe39aff,0xff7f9a];
function current(){return items.find(x=>x.id===selected)}

function record(){const s=snapshot();if(history[cursor]===s)return;history=history.slice(0,cursor+1);history.push(s);cursor=history.length-1;if(history.length>100){history.shift();cursor--}buttons()}

function disposeAll(){for(const x of items)dispose(x)}function dispose(x){if(!x.mesh)return;const disposedG=new Set(),disposedM=new Set();scene.remove(x.mesh);x.mesh.traverse(o=>{if(o.isMesh){if(!disposedG.has(o.geometry)){o.geometry.dispose();disposedG.add(o.geometry)}if(!disposedM.has(o.material)){o.material.dispose();disposedM.add(o.material)}}});x.mesh=null}
function restore(s){disposeAll();const v=JSON.parse(s);items=v.items;selected=v.selected;nextId=v.nextId;folders=v.folders||[];nextFolderId=v.nextFolderId||1;soloId=v.soloId??null;activeChannel=v.activeChannel||1;for(const key of Object.keys(channelArrays))delete channelArrays[key];Object.assign(channelArrays,v.channelArrays||{});for(const x of items){x.array??={...arrayDefaults};x.rotation??={x:0,y:0,z:0};x.material??={color:'#'+colors[x.colorIndex%colors.length].toString(16).padStart(6,'0'),base:'',rough:'',normal:'',disp:''};build(x)}refreshVisibility();renderList();sync();buttons()}

for(const [key,label,min,max,step] of settings){const slot=document.getElementById(key+'Slot');slot.innerHTML='<div class="row"><label for="'+key+'">'+label+'</label><button id="'+key+'Minus" class="step">−</button><input id="'+key+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'"><button id="'+key+'Plus" class="step">+</button><output id="'+key+'Value"></output><button class="mini-reset" id="'+key+'Reset" aria-label="'+label+'をリセット">↺</button></div>';const el=document.getElementById(key);el.addEventListener('input',()=>{const x=current();if(!x)return;x.p[key]=Number(el.value);conflict(x.p,key);sync();build(x)});el.addEventListener('change',record);const resetOne=()=>{const x=current();if(!x)return;x.p[key]=defaults[key];conflict(x.p,key);sync();build(x);record()};document.getElementById(key+'Value').addEventListener('click',()=>{const x=current();if(!x)return;const answer=prompt(label+' ('+min+'〜'+max+')',String(x.p[key]));if(answer===null)return;const value=Number(answer);if(!Number.isFinite(value))return;x.p[key]=Math.max(min,Math.min(max,Math.round(value/step)*step));conflict(x.p,key);sync();build(x);record()});document.getElementById(key+'Reset').addEventListener('click',resetOne);for(const [suffix,dir] of [['Minus',-1],['Plus',1]])document.getElementById(key+suffix).onclick=()=>{const x=current();if(!x)return;x.p[key]=Math.max(min,Math.min(max,Math.round((x.p[key]+dir*step)/step)*step));conflict(x.p,key);sync();build(x);record()}}

function sync(){const x=current();document.getElementById('bevelInner').checked=x?.p.bevelInner!==false;document.getElementById('bevelCuts').checked=x?.p.bevelCuts!==false;document.getElementById('parameters').style.display=x&&x.type==='cylinder'?'':'none';document.getElementById('smooth').disabled=!x;document.getElementById('flat').disabled=!x;if(!x)return;syncExtra();syncMaterial();for(const [key] of settings){document.getElementById(key).value=x.p[key];document.getElementById(key+'Value').textContent=['slices','smoothness'].includes(key)?x.p[key]:x.p[key].toFixed(2)}document.getElementById('flat').classList.toggle('active',x.flat);document.getElementById('smooth').classList.toggle('active',!x.flat)}
function geometry(p){

const g=new THREE.BufferGeometry(),pos=[],uv=[],indices=[];
const R=Math.max(p.size/2,.00025),H=Math.max(p.height/2,.00025),sections=p.slices;

function tri(a,b,c){const ax=pos[a*3],ay=pos[a*3+1],az=pos[a*3+2],bx=pos[b*3],by=pos[b*3+1],bz=pos[b*3+2],cx=pos[c*3],cy=pos[c*3+1],cz=pos[c*3+2];const ux=bx-ax,uy=by-ay,uz=bz-az,vx=cx-ax,vy=cy-ay,vz=cz-az;const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;if(nx*nx+ny*ny+nz*nz>eps*eps)indices.push(a,b,c)}

}
function build(x){
dispose(x);
const base=x.type==='cylinder'?geometry(x.p):x.type==='box'?new THREE.BoxGeometry(1,1,1):new THREE.SphereGeometry(.625,64,48);

const rng=(()=>{let v=(Math.floor(a.seed)||1)>>>0;return()=>{v=(Math.imul(v,1664525)+1013904223)>>>0;return v/4294967296}})();
