const rockPixels='201c17231e19211c18211c17211c171f1b17221d17201b17201c17211c18211c18211c18211d18211c18211c18221d18201b17211c191f1b171f1b17201c17221d181f1b171f1b17221d18211c17201b1726211a221d18221d18221d18221d18231e18211c16221e18221e19231e18221d18221d18201b17211c161e1a16211c171f1b16231d171f1a151e1915201b16211d171f1b16251f19211d18211c17221c171f1b16221d18201c171f1a171f1b171f1b17201c18201b17221d18221d18';const rockCanvas=document.createElement('canvas');rockCanvas.width=rockCanvas.height=8;const rockCtx=rockCanvas.getContext('2d'),rockData=rockCtx.createImageData(8,8);for(let i=0;i<64;i++){const p=rockPixels.slice(i*6,i*6+6);for(let k=0;k<3;k++)rockData.data[i*4+k]=parseInt(p.slice(k*2,k*2+2),16);rockData.data[i*4+3]=255}rockCtx.putImageData(rockData,0,0);const rockTexture=new THREE.CanvasTexture(rockCanvas);rockTexture.colorSpace=THREE.SRGBColorSpace;rockTexture.wrapS=rockTexture.wrapT=THREE.RepeatWrapping;rockTexture.magFilter=THREE.LinearFilter;textures.set(atlasPaths[0],rockTexture);
function loadTexture(path){return localFiles.get(path)||textures.get(path)||null}
function applyMaterial(x,m){const v=x.material||{color:"#ffffff"};const color=new THREE.Color(v.color||'#ffffff').multiplyScalar(v.brightness??1);const strength=k=>(v.strengths?.[k]??materialStrengthDefaults[k])/100;if(v.base&&loadTexture(v.base)){const tex=loadTexture(v.base);m.map=tex;m.color.set('#ffffff');m.onBeforeCompile=shader=>{shader.uniforms.screenTint={value:new THREE.Color('#000000')};shader.uniforms.mapStrength={value:strength('base')};shader.fragmentShader=shader.fragmentShader.replace('#include <common>','#include <common>\nuniform vec3 screenTint;\nuniform float mapStrength;');shader.fragmentShader=shader.fragmentShader.replace('#include <map_fragment>','#include <map_fragment>\ndiffuseColor.rgb = mix(vec3(0.5), diffuseColor.rgb, mapStrength); diffuseColor.rgb = 1.0 - (1.0 - diffuseColor.rgb) * (1.0 - screenTint);')}}else m.color.copy(color);
if(v.rough&&loadTexture(v.rough))m.roughnessMap=loadTexture(v.rough);m.roughness=Math.min(1,(v.roughness??.37)*strength('rough'));if(v.normal&&loadTexture(v.normal))m.normalMap=loadTexture(v.normal);m.normalScale.setScalar(strength('normal'));if(v.disp&&loadTexture(v.disp)){m.displacementMap=loadTexture(v.disp);m.displacementScale=.06*strength('disp')}}
const localTextureNames=new Map();
function shortFilename(name){const chars=Array.from(name);return chars.length>10?chars.slice(0,7).join('')+'...':name}
for(const [key,label] of [['base','Base Color'],['rough','Height/Rough'],['normal','Normal'],['disp','Displacement']]){
 const row=document.createElement('div');row.className='textureRow';row.dataset.textureRow=key;
 const caption=document.createElement('label');caption.textContent=label;caption.htmlFor='texture-'+key;
 const sel=document.createElement('select');sel.id='texture-'+key;sel.dataset.material=key;sel.setAttribute('aria-label',label+' ファイル');
 const none=document.createElement('option');none.value='';none.textContent='なし';sel.append(none);
 for(const [name,path] of catalog[key]){const option=document.createElement('option');option.value=path;option.textContent=shortFilename(name);option.title=name;sel.append(option)}
 row.append(caption,sel);document.getElementById('materialControls').append(row);
 const strengthControl=numericField(row,{id:'strength-'+key,label:label+' 適用度',min:0,max:500,step:1,unit:'%',get:()=>{const x=items.find(y=>y.id===selectedMaterial)||current();return x?(x.material.strengths?.[key]??materialStrengthDefaults[key]):undefined},set:v=>{const x=items.find(y=>y.id===selectedMaterial)||current();if(!x)return;x.material.strengths??={};x.material.strengths[key]=v;build(x)},reset:materialStrengthDefaults[key]});
 strengthControl.row.classList.add('textureStrength');strengthControl.row.querySelector('label').remove();strengthControl.input.dataset.strength=key;
 const fileInput=document.createElement('input');fileInput.type='file';fileInput.accept='.png,.jpg,.jpeg,.exr,image/png,image/jpeg,image/x-exr';fileInput.hidden=true;
 const open=document.createElement('button');open.type='button';open.className='textureOpen';open.textContent='📂';open.title=label+'の画像を開く';open.setAttribute('aria-label',label+'の画像を開く');open.onclick=()=>fileInput.click();row.append(open,fileInput);
 sel.onchange=()=>{const x=items.find(y=>y.id===selectedMaterial)||current();if(!x)return;x.material[key]=sel.value;syncMaterial();build(x);renderMaterials();record()};
 fileInput.onchange=e=>{
  const file=e.target.files[0],x=items.find(y=>y.id===selectedMaterial)||current();if(!file||!x)return;
  const id='local:'+crypto.randomUUID()+':'+key,url=URL.createObjectURL(file);
  (file.name.toLowerCase().endsWith('.exr')?new EXRLoader():new THREE.TextureLoader()).load(url,t=>{
   t.wrapS=t.wrapT=THREE.RepeatWrapping;if(key==='base')t.colorSpace=THREE.SRGBColorSpace;
   localFiles.set(id,t);localTextureNames.set(id,file.name);
   // If Undo removed this object while loading, do not resurrect its mesh.
   const target=items.find(y=>y.id===x.id);if(target){target.material[key]=id;syncMaterial();build(target);renderMaterials();record()}
   URL.revokeObjectURL(url);fileInput.value='';
  },undefined,err=>{console.error('Texture load failed',err);URL.revokeObjectURL(url);fileInput.value=''});
 };
}
function syncMaterial(){const x=items.find(y=>y.id===selectedMaterial)||current();if(!x)return;
 document.getElementById('baseTint').value=x.material.color;document.getElementById('baseTint').disabled=!!x.material.base;
 for(const key of Object.keys(catalog)){
  const sel=document.querySelector('[data-material="'+key+'"]'),path=x.material[key]||'';
  const fullName=localTextureNames.get(path)||catalog[key].find(entry=>entry[1]===path)?.[0]||path.split('/').pop()||'なし';
  let option=[...sel.options].find(option=>option.value===path);
  if(!option){option=document.createElement('option');option.value=path;sel.append(option)}
  option.textContent=shortFilename(fullName);option.title=fullName;sel.value=path;sel.title=fullName;
 }
 drawNumbers();
}

for(const key of ['bevelInner','bevelCuts'])document.getElementById(key).onchange=e=>{const x=current();if(!x)return;x.p[key]=e.target.checked;build(x);record()};
function selectMaterial(id){selectedMaterial=id;selected=id;renderList();renderMaterials();tab('material');syncMaterial();syncMaterialOptions();drawNumbers()}
function syncMaterialOptions(){const x=items.find(y=>y.id===selectedMaterial);if(!x)return;document.getElementById('matName').value=x.material.name||'Material '+x.id;drawNumbers();document.getElementById('matDoubleSide').checked=x.material.doubleSide!==false}
function renderMaterials(){const library=document.getElementById('materialLibrary');library.replaceChildren();for(const x of items){const card=document.createElement('button');card.className='matCard'+(selectedMaterial===x.id?' active':'');const canvas=document.createElement('canvas');canvas.width=canvas.height=96;card.append(canvas);const label=document.createElement('small');label.textContent=x.material.name||'Material '+x.id;card.append(label);card.onclick=()=>selectMaterial(x.id);library.append(card);
const c=canvas.getContext('2d');const gradient=c.createRadialGradient(33,27,4,48,48,43);const base=new THREE.Color(x.material.color||'#808080');const hsl={};base.getHSL(hsl);gradient.addColorStop(0,'#d5d5d5');gradient.addColorStop(.22,'#'+base.clone().multiplyScalar(1.3).getHexString());gradient.addColorStop(.78,'#'+base.getHexString());gradient.addColorStop(1,'#111111');c.beginPath();c.arc(48,48,39,0,Math.PI*2);c.fillStyle=gradient;c.fill();if(x.material.base&&loadTexture(x.material.base)){const t=loadTexture(x.material.base);const img=t.image;if(img){c.save();c.globalCompositeOperation='multiply';c.beginPath();c.arc(48,48,39,0,Math.PI*2);c.clip();try{c.drawImage(img,9,9,78,78)}catch{}c.restore()}}}}
const matOptions=document.createElement('div');matOptions.innerHTML='<div class="group">MATERIAL SETTINGS</div><div class="matRow"><label>名前</label><input id="matName" type="text" style="width:70%"></div><div class="matRow"><label for="baseTint">カラー</label><input id="baseTint" type="color" value="#808080"></div><div id="matNumbers"></div><label class="arrayField"><input id="matDoubleSide" type="checkbox" checked> 裏面表示</label>';document.getElementById('materialTab').prepend(matOptions);
document.getElementById('baseTint').oninput=e=>{const x=items.find(y=>y.id===selectedMaterial)||current();if(!x)return;x.material.color=e.target.value;build(x);renderMaterials()};document.getElementById('baseTint').onchange=record;
for(const [id,key] of [['matDoubleSide','doubleSide'],['matName','name']])document.getElementById(id).addEventListener(id==='matDoubleSide'?'change':'input',e=>{const x=items.find(y=>y.id===selectedMaterial);if(!x)return;x.material[key]=id==='matDoubleSide'?e.target.checked:id==='matName'?e.target.value:Number(e.target.value);build(x);renderMaterials();if(id==='matName')renderList()});
for(const id of ['matDoubleSide','matName'])document.getElementById(id).addEventListener('change',record);
for(const [id,key,label,min,max,step,reset] of [['matBrightness','brightness','明るさ',0,3,.05,1],['matRoughness','roughness','Roughness',0,1,.01,.37]])numericField(document.getElementById('matNumbers'),{id,label,min,max,step,get:()=>{const x=items.find(y=>y.id===selectedMaterial);return x?(x.material[key]??reset):undefined},set:v=>{const x=items.find(y=>y.id===selectedMaterial);if(!x)return;x.material[key]=v;build(x);renderMaterials()},reset});
const workspace=document.getElementById('workspace'),handle=document.getElementById('dividerHandle');let dragging=false;handle.addEventListener('pointerdown',e=>{dragging=true;handle.setPointerCapture(e.pointerId);e.preventDefault()});handle.addEventListener('pointermove',e=>{if(!dragging)return;const rect=workspace.getBoundingClientRect();const percentage=Math.max(18,Math.min(82,(e.clientX-rect.left)/rect.width*100));workspace.style.setProperty('--split',percentage+'%')});handle.addEventListener('pointerup',()=>dragging=false);handle.addEventListener('pointercancel',()=>dragging=false);

const sideResize=document.getElementById('sceneResize'),heightResize=document.getElementById('heightResize');
function resizeDrag(el,move){let active=false;el.onpointerdown=e=>{active=true;el.setPointerCapture(e.pointerId);e.preventDefault()};el.onpointermove=e=>{if(active)move(e)};el.onpointerup=()=>{active=false};el.onpointercancel=()=>{active=false}}
resizeDrag(sideResize,e=>{const rect=document.getElementById('viewport').getBoundingClientRect();const width=Math.max(95,Math.min(rect.width-110,rect.right-e.clientX));document.documentElement.style.setProperty('--scene-width',width+'px')});
resizeDrag(heightResize,e=>{const height=Math.max(120,Math.min(innerHeight-170,e.clientY-30));document.documentElement.style.setProperty('--view-height',height+'px')});
let objectDrag=null;
const outliner=document.getElementById('objects');
outliner.addEventListener('pointerdown',e=>{const name=e.target.closest('[data-drag-object]');if(!name)return;const id=Number(name.dataset.dragObject);const row=name.closest('.object');objectDrag={id,startX:e.clientX,startY:e.clientY,active:false,ghost:null,row};name.setPointerCapture(e.pointerId)});
outliner.addEventListener('pointermove',e=>{const d=objectDrag;if(!d)return;if(!d.active&&Math.hypot(e.clientX-d.startX,e.clientY-d.startY)>8){d.active=true;d.ghost=document.createElement('div');d.ghost.className='dragGhost';d.ghost.textContent=items.find(x=>x.id===d.id)?.name||'Object';document.body.append(d.ghost)}if(!d.active)return;e.preventDefault();d.ghost.style.left=e.clientX+10+'px';d.ghost.style.top=e.clientY+10+'px';document.querySelectorAll('.dropTarget').forEach(n=>n.classList.remove('dropTarget'));const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop-folder],[data-drop-root]');if(hit)hit.classList.add('dropTarget')});
function finishObjectDrag(e){const d=objectDrag;if(!d)return;objectDrag=null;d.ghost?.remove();document.querySelectorAll('.dropTarget').forEach(n=>n.classList.remove('dropTarget'));if(!d.active)return;const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop-folder],[data-drop-root]');if(!hit)return;const x=items.find(x=>x.id===d.id);if(!x)return;x.folderId=hit.dataset.dropRoot?null:Number(hit.dataset.dropFolder);build(x);renderList();record()}
outliner.addEventListener('pointerup',finishObjectDrag);outliner.addEventListener('pointercancel',()=>{objectDrag?.ghost?.remove();objectDrag=null});
