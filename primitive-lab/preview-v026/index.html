const dispGroup=materialGroup('Displacement');const dispControl=numericField(dispGroup,{id:'strength-disp',label:'適用度',min:0,max:500,step:1,unit:'%',get:()=>editedMaterial()?materialParameters(editedMaterial().material).strengths.disp:undefined,set:v=>{const x=editedMaterial();if(!x)return;x.material.strengths??={};x.material.strengths.disp=v;refreshMaterialAppearance(x)},reset:50});textureInput(dispControl.row,'displacement','Displacement');

function makeDialog(id,title){const dialog=document.createElement('dialog');dialog.id=id;const head=document.createElement('div');head.className='dialogHead';const heading=document.createElement('strong');heading.textContent=title;const close=document.createElement('button');close.type='button';close.textContent='閉じる';close.onclick=()=>dialog.close();head.append(heading,close);dialog.append(head);document.body.append(dialog);dialog.addEventListener('click',e=>{if(e.target===dialog){const rect=dialog.getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)dialog.close()}});return dialog}
const channelsDialog=makeDialog('channelsDialog','Texture Channels 1–10');
const channelHint=document.createElement('p');channelHint.className='dialogHint';channelHint.textContent='全マテリアルで共有するテクスチャ入力です。保存はこのページを開いている間のみです。AE版では同じCH番号をカスタムレイヤー入力へ対応させます。';channelsDialog.append(channelHint);
const channelRows=[];
for(let index=0;index<10;index++){
 const row=document.createElement('div');row.className='channelRow';const label=document.createElement('strong');label.textContent='CH '+(index+1);
 const select=document.createElement('select');select.className='channelFile';select.setAttribute('aria-label','CH '+(index+1)+' のテクスチャ');
 const file=document.createElement('input');file.type='file';file.hidden=true;file.accept='.png,.jpg,.jpeg,.exr,.hdr,image/png,image/jpeg';
 const open=document.createElement('button');open.textContent='📂';open.setAttribute('aria-label','CH '+(index+1)+' に画像を読み込む');open.onclick=()=>file.click();
 const clear=document.createElement('button');clear.textContent='解除';clear.onclick=()=>{revision++;textureChannels[index]=null;rebuildMaterials();record()};
 const status=document.createElement('span');status.setAttribute('role','status');status.className='loadStatus';row.append(label,select,open,clear,file,status);channelsDialog.append(row);channelRows.push({select,status});
 select.onchange=()=>{revision++;textureChannels[index]=select.value||null;rebuildMaterials();record()};
 let revision=0;file.onchange=async()=>{const image=file.files[0];if(!image)return;const pending=++revision;status.textContent='読込中';open.disabled=true;try{const id=await importSessionAsset(image);if(pending===revision){textureChannels[index]=id;rebuildMaterials();record();status.textContent=''}}catch(error){status.textContent='読み込み失敗';console.error(error)}finally{open.disabled=false;file.value='';if(status.textContent==='読込中')status.textContent=''}};
}
function syncChannels(){for(let index=0;index<10;index++){const select=channelRows[index]?.select;if(!select)continue;select.replaceChildren();const empty=document.createElement('option');empty.value='';empty.textContent='未設定';select.append(empty);for(const asset of sessionAssets.values()){const option=document.createElement('option');option.value=asset.id;option.textContent=asset.name;select.append(option)}select.value=textureChannels[index]||'';select.title=sessionAssets.get(textureChannels[index])?.name||'未設定'}}
document.getElementById('channelsButton').onclick=()=>{syncChannels();channelsDialog.showModal()};
const environmentDefaults=Object.freeze({source:'studio',intensity:1,rotation:0,exposure:1,background:false,backgroundIntensity:1});
const environmentState={...environmentDefaults},environmentCache=new Map(),environmentAssets=new Set();
function applyEnvironment(){queueThumbnails();
 invalidateScene();
 if(environmentState.source==='studio')scene.environment=studioEnvironment;
 else if(environmentState.source==='none')scene.environment=null;
 else if(environmentCache.has(environmentState.source))scene.environment=environmentCache.get(environmentState.source).texture;
 else scene.environment=studioEnvironment;
 const source=environmentState.source,asset=sessionAssets.get(source);
 scene.background=environmentState.background&&asset?colorTexture(source):new THREE.Color('#1b212b');
 if(scene.background?.isTexture)scene.background.mapping=THREE.EquirectangularReflectionMapping;
 scene.environmentIntensity=environmentState.intensity*lightingState.ambient;scene.backgroundIntensity=environmentState.backgroundIntensity;
 scene.environmentRotation.set(0,environmentState.rotation*Math.PI/180,0);scene.backgroundRotation.copy(scene.environmentRotation);
 renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=environmentState.exposure;
 syncEnvironment();
}
async function prepareEnvironment(id){if(!environmentCache.has(id)){const texture=colorTexture(id);texture.mapping=THREE.EquirectangularReflectionMapping;const generator=new THREE.PMREMGenerator(renderer);try{environmentCache.set(id,generator.fromEquirectangular(texture))}finally{generator.dispose()}}environmentAssets.add(id)}
const environmentDialog=makeDialog('environmentDialog','Environment');
const envRow=document.createElement('div');envRow.className='matRow';const envLabel=document.createElement('label');envLabel.textContent='環境';const envSelect=document.createElement('select');envSelect.id='environmentSource';envSelect.setAttribute('aria-label','環境マップ');const envFile=document.createElement('input');envFile.type='file';envFile.hidden=true;envFile.accept='.hdr,.exr,.png,.jpg,.jpeg';const envOpen=document.createElement('button');envOpen.textContent='📂 HDRIを開く';envOpen.onclick=()=>envFile.click();const envStatus=document.createElement('span');envStatus.setAttribute('role','status');envRow.append(envLabel,envSelect,envOpen,envFile,envStatus);environmentDialog.append(envRow);
const envHint=document.createElement('p');envHint.className='dialogHint';envHint.textContent='HDR / EXR、または全天球のPNG/JPGを環境マップに使えます。反射・環境光の設定です。保存はこのページ内のみです。';environmentDialog.append(envHint);
const environmentControls=[];
for(const [key,label,min,max,step,unit] of [['intensity','強さ',0,10,.05,''],['rotation','回転',-7200,7200,1,'°'],['exposure','露出',0,5,.05,''],['backgroundIntensity','背景強度',0,10,.05,'']])environmentControls.push(numericField(environmentDialog,{id:'env-'+key,label,min,max,step,unit,get:()=>environmentState[key],set:value=>{environmentState[key]=value;applyEnvironment()},reset:environmentDefaults[key]}));
const backgroundRow=document.createElement('label');backgroundRow.className='arrayField';const backgroundToggle=document.createElement('input');backgroundToggle.type='checkbox';backgroundToggle.id='env-background';backgroundRow.append(backgroundToggle,document.createTextNode('環境マップを背景に表示'));environmentDialog.append(backgroundRow);backgroundToggle.onchange=()=>{environmentState.background=backgroundToggle.checked;applyEnvironment();record()};
function syncEnvironment(){envSelect.replaceChildren();for(const [id,name] of [['studio','Studio（内蔵）'],['none','環境マップなし'],...[...environmentAssets].map(id=>[id,sessionAssets.get(id)?.name||id])]){const option=document.createElement('option');option.value=id;option.textContent=name;envSelect.append(option)}envSelect.value=environmentState.source;backgroundToggle.checked=environmentState.background;for(const control of environmentControls)control.draw()}
envSelect.onchange=()=>{environmentRevision++;environmentState.source=envSelect.value;applyEnvironment();record()};
let environmentRevision=0;envFile.onchange=async()=>{const file=envFile.files[0];if(!file)return;const pending=++environmentRevision;envStatus.textContent='読込中';envOpen.disabled=true;try{const id=await importSessionAsset(file);await prepareEnvironment(id);if(pending===environmentRevision){environmentState.source=id;applyEnvironment();syncChannels();syncMaterial();record();envStatus.textContent=''}}catch(error){envStatus.textContent='読み込み失敗';console.error(error)}finally{envFile.value='';envOpen.disabled=false;if(envStatus.textContent==='読込中')envStatus.textContent=''}};
document.getElementById('environmentButton').onclick=()=>{syncEnvironment();environmentDialog.showModal()};
const lightingDialog=makeDialog('lightingDialog','Lighting / ライト・影');
const lightingControls=[];
function lightSelect(key,label,options){const row=document.createElement('div');row.className='matRow';const caption=document.createElement('label');caption.textContent=label;const input=document.createElement('select');input.id='light-'+key;for(const [value,text] of options){const option=document.createElement('option');option.value=value;option.textContent=text;input.append(option)}input.onchange=()=>{lightingState[key]=key==='mapSize'?Number(input.value):input.value;applyLighting();record()};row.append(caption,input);lightingDialog.append(row);lightingControls.push({draw:()=>input.value=String(lightingState[key])})}
lightSelect('type','種類',[['directional','平行光'],['point','ポイント'],['spot','スポット']]);
const colorRow=document.createElement('div');colorRow.className='matRow';const lightColor=document.createElement('input');lightColor.type='color';lightColor.id='light-color';lightColor.oninput=()=>{lightingState.color=lightColor.value;applyLighting()};lightColor.onchange=()=>record();const colorReset=document.createElement('button');colorReset.textContent='↺';colorReset.onclick=()=>{lightingState.color=lightingDefaults.color;applyLighting();syncLighting();record()};colorRow.append(document.createTextNode('ライト色 '),lightColor,colorReset);lightingDialog.append(colorRow);
for(const [key,label,min,max,step] of [['intensity','強さ',0,1000,.1],['ambient','環境光倍率',0,5,.05],['x','位置 X',-50,50,.1],['y','位置 Y',-50,50,.1],['z','位置 Z',-50,50,.1],['targetX','照射先 X',-50,50,.1],['targetY','照射先 Y',-50,50,.1],['targetZ','照射先 Z',-50,50,.1],['angle','スポット角度',1,89,1],['bias','影のBias',-.01,.01,.0001],['floorY','床の高さ',-20,20,.05]])lightingControls.push(numericField(lightingDialog,{id:'light-'+key,label,min,max,step,get:()=>lightingState[key],set:v=>{lightingState[key]=v;applyLighting()},reset:lightingDefaults[key]}));
lightSelect('mapSize','影の解像度',[[64,'64（最低解像度）'],[128,'128'],[256,'256（軽量）'],[512,'512'],[1024,'1024'],[2048,'2048（高精細）']]);
for(const [key,label] of [['shadows','影を描画'],['floor','影を受ける床を表示']]){const row=document.createElement('label');row.className='arrayField';const input=document.createElement('input');input.type='checkbox';input.id='light-'+key;input.onchange=()=>{lightingState[key]=input.checked;applyLighting();record()};row.append(input,document.createTextNode(label));lightingDialog.append(row);lightingControls.push({draw:()=>input.checked=lightingState[key]})}
const lightHint=document.createElement('p');lightHint.className='dialogHint';lightHint.textContent='環境光倍率を下げると影を確認しやすくなります。ポイント光は距離で減衰するため強さを上げてください。平行光の影は原点周辺±12の範囲です。現在はブラウザ内のライトで、AEのライトレイヤー接続は未対応です。';lightingDialog.append(lightHint);
function syncLighting(){lightColor.value=lightingState.color;for(const c of lightingControls)c.draw()}
document.getElementById('lightingButton').onclick=()=>{syncLighting();lightingDialog.showModal()};
applyEnvironment();applyLighting();syncLighting();syncChannels();
const workspace=document.getElementById('workspace'),handle=document.getElementById('dividerHandle');let dragging=false;handle.addEventListener('pointerdown',e=>{dragging=true;handle.setPointerCapture(e.pointerId);e.preventDefault()});handle.addEventListener('pointermove',e=>{if(!dragging)return;const rect=workspace.getBoundingClientRect();const percentage=Math.max(18,Math.min(82,(e.clientX-rect.left)/rect.width*100));workspace.style.setProperty('--split',percentage+'%')});handle.addEventListener('pointerup',()=>dragging=false);handle.addEventListener('pointercancel',()=>dragging=false);

const sideResize=document.getElementById('sceneResize'),heightResize=document.getElementById('heightResize');
function resizeDrag(el,move){let active=false;el.onpointerdown=e=>{active=true;el.setPointerCapture(e.pointerId);e.preventDefault()};el.onpointermove=e=>{if(active)move(e)};el.onpointerup=()=>{active=false};el.onpointercancel=()=>{active=false}}
resizeDrag(sideResize,e=>{const rect=document.getElementById('viewport').getBoundingClientRect();const width=Math.max(95,Math.min(rect.width-110,rect.right-e.clientX));document.documentElement.style.setProperty('--scene-width',width+'px')});
resizeDrag(heightResize,e=>{const height=Math.max(120,Math.min(innerHeight-170,e.clientY-document.querySelector('header').getBoundingClientRect().height));document.documentElement.style.setProperty('--view-height',height+'px')});
let objectDrag=null;
const outliner=document.getElementById('objects');
outliner.addEventListener('pointerdown',e=>{const name=e.target.closest('[data-drag-object]');if(!name)return;const id=Number(name.dataset.dragObject);const row=name.closest('.object');objectDrag={id,startX:e.clientX,startY:e.clientY,active:false,ghost:null,row};name.setPointerCapture(e.pointerId)});
outliner.addEventListener('pointermove',e=>{const d=objectDrag;if(!d)return;if(!d.active&&Math.hypot(e.clientX-d.startX,e.clientY-d.startY)>8){d.active=true;d.ghost=document.createElement('div');d.ghost.className='dragGhost';d.ghost.textContent=items.find(x=>x.id===d.id)?.name||'Object';document.body.append(d.ghost)}if(!d.active)return;e.preventDefault();d.ghost.style.left=e.clientX+10+'px';d.ghost.style.top=e.clientY+10+'px';document.querySelectorAll('.dropTarget').forEach(n=>n.classList.remove('dropTarget'));const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop-folder],[data-drop-root]');if(hit)hit.classList.add('dropTarget')});
function finishObjectDrag(e){const d=objectDrag;if(!d)return;objectDrag=null;d.ghost?.remove();document.querySelectorAll('.dropTarget').forEach(n=>n.classList.remove('dropTarget'));if(!d.active)return;const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop-folder],[data-drop-root]');if(!hit)return;const x=items.find(x=>x.id===d.id);if(!x)return;x.folderId=hit.dataset.dropRoot?null:Number(hit.dataset.dropFolder);build(x);renderList();record()}
outliner.addEventListener('pointerup',finishObjectDrag);outliner.addEventListener('pointercancel',()=>{objectDrag?.ghost?.remove();objectDrag=null});
new ResizeObserver(()=>document.documentElement.style.setProperty('--header-height',document.querySelector('header').getBoundingClientRect().height+'px')).observe(document.querySelector('header'));
new ResizeObserver(()=>{invalidateScene();renderer.setSize(host.clientWidth,host.clientHeight);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix()}).observe(host);
add('cylinder');renderMaterials();function frame(){requestAnimationFrame(frame);const controlsChanged=orbit.update();const now=performance.now();if(sceneNeedsRender||controlsChanged){const start=performance.now();renderer.render(scene,camera);sceneNeedsRender=false;updatePerformanceHud(now,true,performance.now()-start)}else updatePerformanceHud(now,false)}frame();
