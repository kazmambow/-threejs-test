<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Primitive Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#101319;color:#e5ebf5;font:13px -apple-system,BlinkMacSystemFont,sans-serif}header{height:49px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #303743}header b{font-size:16px}header span{color:#7aaefc;font-size:11px}#viewport{height:43dvh;min-height:260px;position:relative;background:#191e27;touch-action:none}#viewport canvas{display:block}#hint{position:absolute;left:12px;bottom:12px;color:#9aaac1;font-size:11px;pointer-events:none}.tag{position:absolute;top:12px;left:12px;color:#a9b6c9;font-size:11px}main{height:calc(100dvh - 49px - 43dvh);min-height:290px;overflow:auto;padding:13px 16px 35px}h3{margin:16px 0 12px;font-size:12px;color:#aebad0;letter-spacing:.05em}select,button{background:#252c39;border:1px solid #3a4557;color:#e5ebf5;border-radius:8px;padding:10px;font:inherit}select{width:100%}.line{display:flex;justify-content:space-between;align-items:center;margin:11px 0 4px}.line output{color:#8bbdff;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#7bb1ff;height:22px}.tabs{display:flex;gap:8px}.tabs button{flex:1}.tabs button.active{background:#295483;border-color:#6ca9ee}.pair{display:grid;grid-template-columns:1fr 1fr;gap:13px}.note{color:#8796ab;font-size:11px;line-height:1.6;margin-top:9px}.bar{display:flex;justify-content:space-between;align-items:center}#reset{padding:6px 11px}</style></head>
<body><header><b>PRIMITIVE LAB</b><span>CYLINDER · v0.1</span></header><div id="viewport"><div class="tag">PERSPECTIVE</div><div id="hint">1本指: 回転　2本指: 移動 / ズーム</div></div><main><div class="bar"><h3>基本図形</h3><button id="reset">初期化</button></div><select id="primitive"><option value="cylinder">円柱 / 円錐 / リング</option><option value="box">立方体</option><option value="sphere">球体</option></select><div id="cylinderControls">
<h3>寸法</h3><div class="pair"><div id="widthSlot"></div><div id="depthSlot"></div></div><div id="heightSlot"></div>
<h3>形状</h3><div id="topSlot"></div><div id="bottomSlot"></div><div id="holeSlot"></div>
<h3>放射状の分割</h3><div id="slicesSlot"></div><div id="gapSlot"></div>
<h3>エッジ</h3><div id="bevelSlot"></div><div id="smoothnessSlot"></div>
</div><h3>シェーディング</h3><div class="tabs"><button id="smooth" class="active">スムーズ</button><button id="flat">フラット</button></div><p class="note">円錐化と穴の大きさは競合します。後から操作した側を優先して、もう一方を自動調整します。ベベルは円周方向の上下エッジに適用します。</p></main>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.169.0';
import {OrbitControls} from 'https://esm.sh/three@0.169.0/examples/jsm/controls/OrbitControls.js';
const host=document.getElementById('viewport'),scene=new THREE.Scene();scene.background=new THREE.Color('#191e27');
const camera=new THREE.PerspectiveCamera(38,1,.05,100);camera.position.set(5,3.6,6.5);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;host.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,0,0);controls.minDistance=2;controls.maxDistance=18;controls.update();
scene.add(new THREE.HemisphereLight(0xdceaff,0x263142,2.2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(3,7,5);scene.add(light);
const grid=new THREE.GridHelper(12,24,0x44536a,0x2b3444);grid.position.y=-1.25;scene.add(grid);
let mesh=null,flat=false;const defaults={width:2.3,depth:2.3,height:2.5,top:0,bottom:0,hole:0,slices:1,gap:0,bevel:0.08,smoothness:4};let p={...defaults};
const config=[['width','横幅',0.2,5,.05],['depth','奥行',.2,5,.05],['height','高さ',.2,5,.05],['top','上面を中心へ',0,1,.01],['bottom','底面を中心へ',0,1,.01],['hole','中心の穴',0,.95,.01],['slices','ケーキ分割数',1,16,1],['gap','分割の隙間',0,.85,.01],['bevel','ベベル幅',0,.35,.005],['smoothness','ベベル分割数',1,12,1]];
for(const [key,label,min,max,step] of config){const slot=document.getElementById(key+'Slot');slot.innerHTML='<div class="line"><label for="'+key+'">'+label+'</label><output id="'+key+'Value"></output></div><input id="'+key+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'">';const el=document.getElementById(key);el.value=p[key];el.addEventListener('input',()=>{p[key]=Number(el.value);if(key==='hole'&&p.hole>0){const cap=1-p.hole;p.top=Math.min(p.top,cap);p.bottom=Math.min(p.bottom,cap)}if((key==='top'||key==='bottom')&&p[key]>0){p.hole=Math.min(p.hole,1-Math.max(p.top,p.bottom))}sync();build()})}
function sync(){for(const [key] of config){document.getElementById(key).value=p[key];document.getElementById(key+'Value').textContent=(key==='slices'||key==='smoothness')?p[key]:p[key].toFixed(2)}}
function addQuad(pos,uv,a,b,c,d){const indices=[a,b,c,a,c,d];for(const k of indices){pos.push(...k);uv.push(0,0)}}
function makeCylinder(){const vertices=[],uv=[],N=96,S=p.slices,rx=p.width/2,rz=p.depth/2,h=p.height/2,b=Math.min(p.bevel,h*.48,rx*.3,rz*.3),steps=b>0?p.smoothness:1;const hole=p.hole;const baseRadius=Math.max(.0001,hole);const topOuter=Math.max(.0001,1-p.top),bottomOuter=Math.max(.0001,1-p.bottom);
function v(r,y,a){return [Math.cos(a)*r*rx,y,Math.sin(a)*r*rz]}
function surface(r0,y0,r1,y1,a0,a1,seg){for(let j=0;j<seg;j++){const a=a0+(a1-a0)*j/seg,z=a0+(a1-a0)*(j+1)/seg;addQuad(vertices,uv,v(r0,y0,a),v(r0,y0,z),v(r1,y1,z),v(r1,y1,a))}}
for(let s=0;s<S;s++){const step=2*Math.PI/S,delta=step*p.gap,from=s*step+delta/2,to=(s+1)*step-delta/2,n=Math.max(4,Math.round(N/S*(1-p.gap)));if(to<=from)continue;
const profile=[];for(let i=0;i<=steps;i++){const t=i/steps,angle=t*Math.PI/2;profile.push([bottomOuter-b/Math.max(rx,rz)+b/Math.max(rx,rz)*Math.sin(angle),-h+b-b*Math.cos(angle)])}
profile.push([bottomOuter,h-b]);for(let i=1;i<=steps;i++){const t=i/steps,angle=t*Math.PI/2;profile.push([topOuter-b/Math.max(rx,rz)+b/Math.max(rx,rz)*Math.cos(angle),h-b+b*Math.sin(angle)])}
for(let i=0;i<profile.length-1;i++){const [r0,y0]=profile[i],[r1,y1]=profile[i+1];surface(r0,y0,r1,y1,from,to,n)}
const inner=Math.min(baseRadius,topOuter,bottomOuter);surface(inner,h,Math.max(inner,topOuter-b/Math.max(rx,rz)),h,from,to,n);surface(Math.max(inner,bottomOuter-b/Math.max(rx,rz)),-h,inner,-h,from,to,n);
if(hole>0){surface(inner,-h,inner,h,from,to,n)}
for(const a of [from,to]){for(let i=0;i<profile.length-1;i++){const [r0,y0]=profile[i],[r1,y1]=profile[i+1];const A=v(inner,y0,a),B=v(r0,y0,a),C=v(r1,y1,a),D=v(inner,y1,a);addQuad(vertices,uv,A,B,C,D)}}}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
return g}
function build(){if(mesh){scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose()}let geometry;const type=document.getElementById('primitive').value;if(type==='cylinder')geometry=makeCylinder();else if(type==='box')geometry=new THREE.BoxGeometry(2,2,2);else geometry=new THREE.SphereGeometry(1.35,48,32);
geometry.computeVertexNormals();const material=new THREE.MeshStandardMaterial({color:0x7baee6,metalness:.28,roughness:.38,side:THREE.DoubleSide,flatShading:flat});mesh=new THREE.Mesh(geometry,material);scene.add(mesh);document.getElementById('cylinderControls').style.display=type==='cylinder'?'':'none'}
document.getElementById('primitive').addEventListener('change',build);document.getElementById('reset').onclick=()=>{p={...defaults};sync();build()};for(const [name,value] of [['flat',true],['smooth',false]])document.getElementById(name).onclick=()=>{flat=value;document.getElementById('flat').classList.toggle('active',flat);document.getElementById('smooth').classList.toggle('active',!flat);build()};
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);sync();build();function tick(){requestAnimationFrame(tick);controls.update();renderer.render(scene,camera)}tick();
</script></body></html>
