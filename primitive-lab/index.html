*[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#11141b;color:#e8edf6;font:10px -apple-system,BlinkMacSystemFont,sans-serif}header{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 9px;border-bottom:1px solid #303746}header b{font-size:11px}.actions{display:flex;gap:4px}button,select{border:1px solid #3a4659;background:#222b38;color:#dce7f7;border-radius:5px;padding:4px;font:inherit}button:disabled{opacity:.3}button.active{background:#2d5887;border-color:#6b9bca}#viewport{height:43dvh;min-height:225px;background:#1b212b;position:relative;touch-action:none}.hint{position:absolute;bottom:7px;left:9px;color:#8f9db0;font-size:9px;pointer-events:none}main{height:calc(100dvh - 30px - 43dvh);display:grid;grid-template-columns:var(--split, 50%) 6px minmax(0,1fr);overflow:hidden}.panel{min-width:0;overflow:auto;padding:6px 5px 20px}.dividerHandle{background:#354153;touch-action:none;cursor:col-resize;position:relative}.dividerHandle:after{content:"";position:absolute;top:45%;left:2px;width:2px;height:30px;border-radius:3px;background:#83b6f5}.tabbar{display:flex;gap:3px;margin-bottom:5px}.tabbar button{flex:1;font-size:9px}.arrayField{display:flex;align-items:center;gap:3px;margin:3px 0}.arrayField label{width:50px;flex:none;color:#b7c5d9;font-size:9px}.arrayField input[type=range]{flex:1;min-width:0;accent-color:#78aefe}.arrayField output{width:28px;text-align:right;color:#9cc5ff;font-size:9px}.arrayField select{width:100%;min-width:0}.knob{width:34px;height:34px;border-radius:50%;border:2px solid #6898c7;background:#27394c;position:relative;touch-action:none;flex:none}.knob:after{content:"";position:absolute;left:14px;top:3px;width:3px;height:11px;background:#b7d9ff;transform-origin:1.5px 13px;transform:rotate(var(--angle,0deg))}.dialRow{display:flex;align-items:center;gap:5px;margin:4px 0}.dialRow label{width:48px;flex:none}.dialRow output{color:#9cc5ff}.step{padding:1px 3px;min-width:16px}.matRow{display <script type="module">

const host=document.getElementById('viewport'),scene=new THREE.Scene();scene.background=new THREE.Color('#1b212b');
const camera=new THREE.PerspectiveCamera(38,1,.05,100);camera.position.set(4.4,3.3,7);

const grid=new THREE.GridHelper(16,32,0x4c5a71,0x2a3546);grid.position.y=-1.5;scene.add(grid);

let items=[],selected=0,nextId=1,history=[],cursor=-1,activeTab="props";const arrayDefaults={mode:"single",countX:2,countY:2,countZ:2,spacing:0.3,scatter:0,seed:1,sizeRandom:0,surfaceCount:20,surfaceRadius:2,surfaceHeight:2.5,rotationX:0,rotationY:0,rotationZ:0,randomRotation:0};const colors=[0x75b9ff,0xffaa65,0x85dfaa,0xe39aff,0xff7f9a];
function current(){return items.find(x=>x.id===selected)}

function buttons(){document.getElementById('undo').disabled=cursor<=0;document.getElementById('redo').disabled=cursor>=history.length-1}
function disposeAll(){for(const x of items)dispose(x)}function dispose(x){if(!x.mesh)return;const disposedG=new Set(),disposedM=new Set();scene.remove(x.mesh);x.mesh.traverse(o=>{if(o.isMesh){if(!disposedG.has(o.geometry)){o.geometry.dispose();disposedG.add(o.geometry)}if(!disposedM.has(o.material)){o.material.dispose();disposedM.add(o.material)}}});x.mesh=null}
function restore(s){disposeAll();const v=JSON.parse(s);items=v.items;selected=v.selected;nextId=v.nextId;for(const x of items){x.array??={...arrayDefaults};x.rotation??={x:0,y:0,z:0};x.material??={color:'#'+colors[x.colorIndex%colors.length].toString(16).padStart(6,'0'),base:'',rough:'',normal:'',disp:''};build(x)}renderList();sync();buttons()}
document.getElementById('undo').onclick=()=>{if(cursor>0)restore(history[--cursor])};document.getElementById('redo').onclick=()=>{if(cursor<history.length-1)restore(history[++cursor])};
for(const [key,label,min,max,step] of settings){const slot=document.getElementById(key+'Slot');slot.innerHTML='<div class="row"><label for="'+key+'">'+label+'</label><button id="'+key+'Minus" class="step">−</button><input id="'+key+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'"><button id="'+key+'Plus" class="step">+</button><output id="'+key+'Value"></output><button class="mini-reset" id="'+key+'Reset" aria-label="'+label+'をリセット">↺</button></div>';const el=document.getElementById(key);el.addEventListener('input',()=>{const x=current();if(!x)return;x.p[key]=Number(el.value);conflict(x.p,key);sync();build(x)});el.addEventListener('change',record);const resetOne=()=>{const x=current();if(!x)return;x.p[key]=defaults[key];conflict(x.p,key);sync();build(x);record()};document.getElementById(key+'Value').addEventListener('dblclick',resetOne);document.getElementById(key+'Reset').addEventListener('click',resetOne);for(const [suffix,dir] of [['Minus',-1],['Plus',1]])document.getElementById(key+suffix).onclick=()=>{const x=current();if(!x)return;x.p[key]=Math.max(min,Math.min(max,Math.round((x.p[key]+dir*step)/step)*step));conflict(x.p,key);sync();build(x);record()}}
function conflict(p,key){if(key==='cone')p.hole=Math.min(p.hole,1-p.cone);if(key==='hole')p.cone=Math.min(p.cone,1-p.hole)}
function sync(){const x=current();document.getElementById('parameters').style.display=x&&x.type==='cylinder'?'':'none';document.getElementById('smooth').disabled=!x;document.getElementById('flat').disabled=!x;if(!x)return;syncExtra();syncMaterial();for(const [key] of settings){document.getElementById(key).value=x.p[key];document.getElementById(key+'Value').textContent=['slices','smoothness'].includes(key)?x.p[key]:x.p[key].toFixed(2)}document.getElementById('flat').classList.toggle('active',x.flat);document.getElementById('smooth').classList.toggle('active',!x.flat)}
function geometry(p){

const g=new THREE.BufferGeometry(),pos=[],uv=[],indices=[];
const R=p.size/2,H=p.height/2,sections=p.slices;
const inner=p.hole,round=p.bevel*Math.min(R,H);
const rows=Math.max(64,p.smoothness*8),N=128;
const eps=1e-7;
function vertex(r,y,a){const id=pos.length/3;pos.push(Math.cos(a)*r,y,Math.sin(a)*r);uv.push(a/(2*Math.PI),(y+H)/(2*H));return id}
function tri(a,b,c){const ax=pos[a*3],ay=pos[a*3+1],az=pos[a*3+2],bx=pos[b*3],by=pos[b*3+1],bz=pos[b*3+2],cx=pos[c*3],cy=pos[c*3+1],cz=pos[c*3+2];const ux=bx-ax,uy=by-ay,uz=bz-az,vx=cx-ax,vy=cy-ay,vz=cz-az;const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;if(nx*nx+ny*ny+nz*nz>eps*eps)indices.push(a,b,c)}
function quad(a,b,c,d){tri(a,b,c);tri(a,c,d)}
function baseRadius(t){const b=p.basePosition;const denom=t<b?Math.max(b,1e-6):Math.max(1-b,1e-6);return Math.max(0,1-p.cone*Math.abs(t-b)/denom)}

function outer(t){return Math.max(0,bevelRadius(t)*baseRadius(t))}
function inside(t){return Math.min(R*inner,outer(t))}
for(let s=0;s<sections;s++){
const span=2*Math.PI/sections,trim=span*p.gap/2,a0=s*span+trim,a1=(s+1)*span-trim;
if(a1-a0<1e-5)continue;
const cols=Math.max(4,Math.ceil(N/sections*(1-p.gap))),out=[],inn=[];
for(let j=0;j<=rows;j++){const t=j/rows,y=-H+p.height*t,ro=outer(t),ri=inside(t),oo=[],ii=[];
for(let i=0;i<=cols;i++){const a=a0+(a1-a0)*i/cols;oo.push(vertex(ro,y,a));ii.push(vertex(ri,y,a))}
out.push(oo);inn.push(ii)}

quad(out[j][i],out[j][i+1],out[j+1][i+1],out[j+1][i]);
if(inner>0)quad(inn[j][i+1],inn[j][i],inn[j+1][i],inn[j+1][i+1])
}
for(const j of [0,rows])for(let i=0;i<cols;i++){
if(j===0)quad(inn[j][i],inn[j][i+1],out[j][i+1],out[j][i]);
else quad(out[j][i],out[j][i+1],inn[j][i+1],inn[j][i])
}
if(sections>1||p.gap>0)for(const i of [0,cols])for(let j=0;j<rows;j++){
if(i===0)quad(inn[j][i],out[j][i],out[j+1][i],inn[j+1][i]);
else quad(out[j][i],inn[j][i],inn[j+1][i],out[j+1][i])
}
}
g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
g.setIndex(indices);

g.computeVertexNormals();
return g

}
function build(x){
dispose(x);
const base=x.type==='cylinder'?geometry(x.p):x.type==='box'?new THREE.BoxGeometry(1,1,1):new THREE.SphereGeometry(.625,64,48);
const material=new THREE.MeshStandardMaterial({color:colors[x.colorIndex%colors.length],metalness:.24,roughness:.37,side:THREE.DoubleSide,flatShading:x.flat});applyMaterial(x,material);
const group=new THREE.Group(),a=x.array||arrayDefaults,rot=x.rotation||{x:0,y:0,z:0};
const rng=(()=>{let v=(Math.floor(a.seed)||1)>>>0;return()=>{v=(Math.imul(v,1664525)+1013904223)>>>0;return v/4294967296}})();
function instance(px,py,pz,rx=0,ry=0,rz=0){const m=new THREE.Mesh(base,material);m.position.set(px,py,pz);const d=Math.PI/180,random=()=>((rng()*2)-1)*a.randomRotation*d;m.scale.setScalar(Math.max(.001,1+(rng()*2-1)*a.sizeRandom/100));m.rotation.set(rx+a.rotationX*d+random(),ry+a.rotationY*d+random(),rz+a.rotationZ*d+random());group.add(m)}
if(a.mode==='grid'){
const nx=a.countX,ny=a.countY,nz=a.countZ,d=a.spacing;
for(let ix=0;ix<nx;ix++)for(let iy=0;iy<ny;iy++)for(let iz=0;iz<nz;iz++){
const j=a.scatter;instance((ix-(nx-1)/2)*d+(rng()-.5)*2*j,(iy-(ny-1)/2)*d+(rng()-.5)*j,(iz-(nz-1)/2)*d+(rng()-.5)*j)}
}else if(a.mode==='surface'){
for(let i=0;i<a.surfaceCount;i++){const angle=2*Math.PI*i/a.surfaceCount,h=((i+.5)/a.surfaceCount-.5)*a.surfaceHeight;
instance(Math.cos(angle)*a.surfaceRadius+(rng()-.5)*2*a.scatter,h+(rng()-.5)*2*a.scatter,Math.sin(angle)*a.surfaceRadius+(rng()-.5)*2*a.scatter,0,-angle,0)}
}else instance(0,0,0);

x.mesh=group;scene.add(group)
}
function renderList(){const el=document.getElementById('objects');el.replaceChildren();for(const x of items){const row=document.createElement('div');row.className='object'+(x.id===selected?' selected':'');const name=document.createElement('span');name.className='name';name.textContent=x.name;const dot=document.createElement('span');dot.style.cssText='display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;background:#'+colors[x.colorIndex%colors.length].toString(16).padStart(6,'0');row.append(dot,name);row.addEventListener('click',()=>{selected=x.id;renderList();sync();record()});el.append(row)}document.getElementById("add").disabled=items.length>=5}
function add(type){if(items.length>=5)return;const used=new Set(items.map(x=>x.colorIndex));const colorIndex=[0,1,2,3,4].find(i=>!used.has(i));const id=nextId++;const labels={cylinder:'円柱（パラメトリック）',box:'立方体',sphere:'球体'};const x={id,name:labels[type]+' '+id,type,p:{...defaults},flat:false,colorIndex,material:{color:'#'+colors[colorIndex].toString(16).padStart(6,'0'),base:'',rough:'',normal:'',disp:''},array:{...arrayDefaults},rotation:{x:0,y:0,z:0}};items.push(x);selected=id;build(x);renderList();sync();record()}
document.getElementById('add').onclick=()=>add(document.getElementById('addType').value);
document.getElementById('reset').onclick=()=>{const x=current();if(!x)return;x.p={...defaults};x.flat=false;x.rotation={x:0,y:0,z:0};x.array={...arrayDefaults};build(x);sync();record()};
for(const [id,v] of [['flat',true],['smooth',false]])document.getElementById(id).onclick=()=>{const x=current();if(!x)return;x.flat=v;build(x);sync();record()};
const fields=[['countX','X個数',1,5,1],['countY','Y個数',1,5,1],['countZ','Z個数',1,5,1],['spacing','隙間',0,5,.05],['scatter','Scatter',0,50,.1],['sizeRandom','サイズ乱数',0,100,1],['seed','Seed',1,9999,1],['surfaceCount','配置数',1,100,1],['surfaceRadius','配置半径',.2,5,.05],['surfaceHeight','配置高さ',.2,5,.05]];
for(const [axis,label] of [['x','回転 X'],['y','回転 Y'],['z','回転 Z']]){const holder=document.createElement('div');holder.className='arrayField';holder.innerHTML='<label>'+label+'</label><input type="range" min="-180" max="180" step="1"><output>0°</output><button class="mini-reset">↺</button>';document.getElementById('parameters').append(holder);const input=holder.querySelector('input'),out=holder.querySelector('output');input.dataset.rotation=axis;input.addEventListener('input',()=>{const x=current();if(!x)return;x.rotation[axis]=Number(input.value);out.textContent=input.value+'°';build(x)});input.addEventListener('change',record);holder.querySelector('button').onclick=()=>{const x=current();if(!x)return;x.rotation[axis]=0;syncExtra();build(x);record()}}
for(const [key,label,min,max,step] of fields){const holder=document.createElement('div');holder.className='arrayField';holder.dataset.field=key;holder.innerHTML='<label>'+label+'</label><button class="step minus">−</button><input type="range" min="'+min+'" max="'+max+'" step="'+step+'"><button class="step plus">+</button><output></output><button class="mini-reset">↺</button>';document.getElementById('arrayControls').append(holder);const input=holder.querySelector('input');input.addEventListener('input',()=>{const x=current();if(!x)return;x.array[key]=Number(input.value);syncExtra();build(x)});input.addEventListener('change',record);holder.querySelector('.mini-reset').onclick=()=>{const x=current();if(!x)return;x.array[key]=arrayDefaults[key];syncExtra();build(x);record()};for(const [selector,dir] of [['.minus',-1],['.plus',1]])holder.querySelector(selector).onclick=()=>{const x=current();if(!x)return;x.array[key]=Math.max(min,Math.min(max,Math.round((x.array[key]+dir*step)/step)*step));syncExtra();build(x);record()}}
function makeDial(parent,key,label,scope){const row=document.createElement('div');row.className='dialRow';row.innerHTML='<label>'+label+'</label><button class="step minus">−</button><div class="knob"></div><button class="step plus">+</button><output></output><button class="mini-reset">↺</button>';parent.append(row);const knob=row.querySelector('.knob'),out=row.querySelector('output'),min=key==='randomRotation'?0:-7200,max=key==='randomRotation'?7200:180;let down=false,start=0,origin=0;
const get=()=>{const x=current();return x?(scope==='array'?x.array:x.rotation)[key]:0};
const draw=()=>{const v=get();out.textContent=v+'°';knob.style.setProperty('--angle',((v-min)/(max-min)*270-135)+'deg')};
const set=v=>{const x=current();if(!x)return;(scope==='array'?x.array:x.rotation)[key]=Math.max(min,Math.min(max,Math.round(v)));draw();build(x)};
knob.onpointerdown=e=>{down=true;start=e.clientY;origin=get();knob.setPointerCapture(e.pointerId)};knob.onpointermove=e=>{if(down)set(origin+(start-e.clientY)*1.5)};knob.onpointerup=()=>{down=false;record()};knob.onpointercancel=()=>{down=false;record()};row.querySelector('.mini-reset').onclick=()=>{set(0);record()};row.querySelector('.minus').onclick=()=>{set(get()-1);record()};row.querySelector('.plus').onclick=()=>{set(get()+1);record()};return {draw,row}}
const dials=[];
for(const axis of ['x','y','z']){const input=document.querySelector('[data-rotation="'+axis+'"]');if(input)input.parentElement.remove();dials.push(makeDial(document.getElementById('parameters'),axis,'回転 '+axis.toUpperCase(),'rotation'))}
for(const [key,label] of [['rotationX','配列 X'],['rotationY','配列 Y'],['rotationZ','配列 Z'],['randomRotation','ランダム']])dials.push(makeDial(document.getElementById('arrayControls'),key,label,'array'));
document.getElementById('arrayMode').onchange=e=>{const x=current();if(!x)return;x.array.mode=e.target.value;syncExtra();build(x);record()};
function syncExtra(){const x=current();if(!x)return;document.getElementById('arrayMode').value=x.array.mode;for(const [key] of fields){const holder=document.querySelector('[data-field="'+key+'"]');holder.querySelector('input').value=x.array[key];holder.querySelector('output').textContent=x.array[key];holder.style.display=x.array.mode==='single'?'none':x.array.mode==='grid'?(key.startsWith('surface')?'none':'flex'):(['countX','countY','countZ','spacing'].includes(key)?'none':'flex')}for(const dial of dials)dial.draw();for(let i=3;i<dials.length;i++)dials[i].row.style.display=x.array.mode==='single'?'none':'flex'}

const catalog={base:[['dark_rock_diff_4k','materials/base/dark_rock_diff_4k.json']],rough:[['dark_rock_rough_4k','materials/height_rough/dark_rock_rough_4k.json']],normal:[['dark_rock_nor_gl_4k','materials/normal/dark_rock_nor_gl_4k.json']],disp:[['dark_rock_disp_4k','materials/displacement/dark_rock_disp_4k.json']]};
const textures=new Map();

function loadTexture(path){return textures.get(path)||null}
function applyMaterial(x,m){const v=x.material||{color:"#ffffff"};const color=new THREE.Color(v.color||'#ffffff');if(v.base&&loadTexture(v.base)){const tex=loadTexture(v.base);m.map=tex;m.color.set('#ffffff');m.onBeforeCompile=shader=>{shader.uniforms.screenTint={value:new THREE.Color('#000000')};shader.fragmentShader=shader.fragmentShader.replace('#include <common>','#include <common>\nuniform vec3 screenTint;');shader.fragmentShader=shader.fragmentShader.replace('#include <map_fragment>','#include <map_fragment>\ndiffuseColor.rgb = 1.0 - (1.0 - diffuseColor.rgb) * (1.0 - screenTint);')}}else m.color.copy(color);
if(v.rough&&loadTexture(v.rough))m.roughnessMap=loadTexture(v.rough);if(v.normal&&loadTexture(v.normal))m.normalMap=loadTexture(v.normal);if(v.disp&&loadTexture(v.disp)){m.displacementMap=loadTexture(v.disp);m.displacementScale=.06}}
for(const [key,label] of [['base','Base Color'],['rough','Height / Rough'],['normal','Normal'],['disp','Displacement']]){const row=document.createElement('div');row.className='matRow';row.innerHTML='<label>'+label+'</label><select><option value="">なし</option></select>';document.getElementById('materialControls').append(row);const sel=row.querySelector('select');sel.dataset.material=key;for(const [name,path] of catalog[key]){const opt=document.createElement('option');opt.value=path;opt.textContent=name;sel.append(opt)}sel.onchange=()=>{const x=current();if(!x)return;x.material[key]=sel.value;syncMaterial();build(x);record()}}
