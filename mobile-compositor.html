<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#202024"><title>Frame / Mobile Compositor</title>
<style>
:root{color-scheme:dark;--bg:#202024;--panel:#29292e;--line:#3c3c44;--muted:#92929e;--text:#d5d5df;--blue:#8ba8ff;--purple:#9e85ec}*{box-sizing:border-box}body{margin:0;background:#161619;color:var(--text);font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}button,input,select{font:inherit}button{color:inherit;border:1px solid var(--line);background:#33333a;border-radius:3px;min-height:28px;padding:4px 9px;cursor:pointer}button:disabled{opacity:.35}button:active{background:#494958}button:focus-visible,input:focus-visible{outline:2px solid var(--blue)}.app{width:100%;height:100dvh;max-width:760px;margin:auto;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-rows:32px minmax(180px,42fr) minmax(120px,23fr) minmax(180px,35fr);background:var(--bg)}header{display:flex;align-items:center;gap:9px;padding:0 10px;border-bottom:1px solid #101013;background:#252529}.mark{font-size:12px;font-weight:700;color:#b6a5ff}.project{font-size:10px;color:#a7a7b2}.badge{margin-left:auto;font-size:9px;color:#9a9aa6;letter-spacing:.5px}.panel{min-width:0;min-height:0;display:flex;flex-direction:column;border-bottom:3px solid #151518}.bar{height:30px;min-height:30px;display:flex;align-items:center;gap:7px;background:var(--panel);padding:0 9px;border-bottom:1px solid var(--line)}.tab{height:100%;display:flex;align-items:center;border-bottom:2px solid var(--blue);font-size:10px;white-space:nowrap}.dim{color:var(--muted);font-size:9px}.spacer{flex:1}.bar button{min-height:23px;font-size:10px;padding:2px 7px}.viewer{position:relative;min-height:0;flex:1;background:#17171a;display:flex;align-items:center;justify-content:center;overflow:hidden}.viewer:before{content:"";position:absolute;inset:12px;border:1px solid #29292e;pointer-events:none}canvas{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;position:relative}.viewer .corner{position:absolute;left:8px;top:7px;font-size:8px;color:#7c7c87;pointer-events:none}.controls{height:33px;min-height:33px;display:flex;align-items:center;padding:0 9px;gap:7px;background:#252529;border-top:1px solid #34343b}.controls button{min-height:24px;padding:2px 9px}.time{color:var(--blue);font:11px ui-monospace,monospace}.controls select{background:#29292e;border:1px solid #44444e;color:#bbbcc9;border-radius:2px;font-size:9px;padding:3px}.pool{overflow:auto;flex:1;padding:7px;display:flex;align-content:flex-start;gap:7px;flex-wrap:wrap}.asset{position:relative;width:83px;height:73px;padding:0;overflow:hidden;background:#1c1c20;display:flex;flex-direction:column;align-items:stretch;text-align:left;border-color:#45454f}.asset.selected{border-color:var(--blue)}.thumb{height:46px;flex-shrink:0;background:linear-gradient(145deg,#234e64,#6d4c8e);display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.thumb .letter{font-size:26px;font-weight:700;color:#e4dafa}.asset-name{padding:3px 4px;font-size:9px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.asset-type{position:absolute;right:3px;top:3px;color:white;background:#17171a99;font-size:8px;padding:1px 3px}.poolhint{font-size:9px;color:#92929e;width:100%;padding:2px}.toolbar{display:flex;align-items:center;gap:7px;min-height:32px;padding:3px 8px;border-bottom:1px solid var(--line);background:#242428}.toolbar button{min-height:23px;padding:2px 6px;font-size:10px}.toolbar label{color:#9696a2;font-size:9px;display:flex;align-items:center;gap:4px}.toolbar input[type=range]{width:55px;accent-color:var(--blue)}.timeline{flex:1;overflow:auto;position:relative;min-height:0;background:#202024}.timeline-grid{position:relative;min-width:100%;min-height:100%}.ruler{height:25px;position:relative;border-bottom:1px solid #44444b;background:#252529;margin-left:114px;touch-action:none}.tick{position:absolute;top:0;height:100%;border-left:1px solid #51515c;padding-left:3px;padding-top:5px;color:#9c9ca8;font:8px ui-monospace,monospace;pointer-events:none}.row{height:38px;display:flex;border-bottom:1px solid #303037}.row.active{background:#30303a}.layer-name{width:114px;flex-shrink:0;display:flex;align-items:center;gap:5px;padding:0 6px;font-size:9px;position:sticky;left:0;z-index:2;background:#28282e;border-right:1px solid #45454d}.layer-name span.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.layer-name button{border:0;background:none;min-height:26px;padding:0 2px;font-size:11px}.layer-no{color:#7f7f8b;font:9px ui-monospace,monospace}.track{position:relative;flex:1;min-width:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),#ffffff05 calc(10% - 1px),#ffffff05 10%);touch-action:none}.clip{height:24px;top:6px;position:absolute;border-radius:2px;background:#7763ad;border:1px solid #a18bcf;overflow:hidden;white-space:nowrap;font-size:9px;padding:5px 5px;color:#f1ecff;min-width:5px;touch-action:none}.clip.video{background:#4b7893;border-color:#77a6c1}.clip.image{background:#4c8b7f;border-color:#7ab0a5}.active .clip{box-shadow:0 0 0 1px #d9caff}.playhead{position:absolute;left:114px;top:0;bottom:0;width:1px;background:#8ba8ff;z-index:3;pointer-events:none}.playhead:before{content:"";position:absolute;top:0;left:-4px;width:9px;height:10px;background:#8ba8ff;clip-path:polygon(0 0,100% 0,100% 65%,50% 100%,0 65%)}.status{height:22px;min-height:22px;display:flex;align-items:center;padding:0 8px;border-top:1px solid var(--line);font-size:9px;color:#8e8e9c;gap:8px}.dot{width:5px;height:5px;border-radius:50%;background:#8da9ff}.properties{display:flex;align-items:center;gap:7px;padding:4px 8px;min-height:31px;background:#26262b;border-bottom:1px solid var(--line);overflow:auto;white-space:nowrap}.properties label{display:flex;align-items:center;gap:4px;color:#9898a6;font-size:9px}.properties input{width:43px;background:#1e1e23;border:1px solid #41414a;border-radius:2px;color:#b5c6ff;padding:4px;font-size:10px}.properties input[type=color]{width:26px;height:24px;padding:1px}.properties .text-input{width:90px}dialog{background:#2a2a31;color:var(--text);border:1px solid #51515d;border-radius:10px;width:min(330px,90vw);padding:14px;box-shadow:0 20px 90px #0009}dialog::backdrop{background:#0007}dialog h3{font-size:12px;margin:0 0 14px}dialog button{display:block;width:100%;text-align:left;margin:6px 0;min-height:40px}dialog p{color:#9999a7;font-size:10px;line-height:1.6}.toast{position:fixed;bottom:calc(30px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#424250;box-shadow:0 4px 20px #0008;padding:10px 15px;border-radius:5px;max-width:90vw;z-index:20;font-size:11px;pointer-events:none;opacity:0;transition:opacity .15s}.toast.show{opacity:1}@media(min-width:650px){.app{border-left:1px solid #3b3b43;border-right:1px solid #3b3b43}.pool .asset{width:100px}}@media(max-height:650px){.app{grid-template-rows:28px minmax(130px,40fr) minmax(95px,23fr) minmax(155px,37fr)}.properties{min-height:28px}.asset{height:60px}.thumb{height:35px}}
</style>
<div class="app">
<header><span class="mark">Fr</span><span>Frame</span><span class="project">/ Untitled project</span><span class="badge">MOBILE COMPOSITOR · 01</span></header>
<section class="panel"><div class="bar"><span class="tab">コンポジション</span><span class="dim">Comp 01</span><span class="spacer"></span><span class="dim">1920 × 1080 · 30 fps</span></div><div class="viewer"><canvas id="canvas" width="960" height="540" aria-label="コンポジションのプレビュー"></canvas><span class="corner">FIT / HALF</span></div><div class="controls"><span id="time" class="time">0:00:00:00</span><span class="spacer"></span><button id="start" aria-label="先頭に移動">|◀</button><button id="play" aria-label="再生">▶</button><button id="next" aria-label="1フレーム進む">▶|</button><span class="spacer"></span><select id="quality" aria-label="プレビュー解像度"><option value="960">1/2</option><option value="480">1/4</option></select></div></section>
<section class="panel"><div class="bar"><span class="tab">メディアプール</span><span id="count" class="dim">0 items</span><span class="spacer"></span><button id="import">＋ インポート</button></div><div id="pool" class="pool"></div><div class="status"><span id="assetInfo">素材を選択 → ＋でタイムラインへ</span><span class="spacer"></span><button id="add" style="min-height:19px;padding:0 7px;font-size:10px" disabled>＋ 追加</button></div></section>
<section class="panel" style="border-bottom:0"><div class="bar"><span class="tab">タイムライン</span><span class="dim">Comp 01</span><span class="spacer"></span><button id="save" title="編集内容をJSON保存">保存</button></div><div class="toolbar"><button id="text">T テキスト</button><button id="duplicate">複製</button><button id="delete">削除</button><span class="spacer"></span><label>尺 <input id="duration" type="number" min="1" max="300" value="10" style="width:39px;background:#202024;border:1px solid #41414a;color:#b5c6ff;padding:3px"> 秒</label></div><div id="properties" class="properties"></div><div id="timeline" class="timeline"><div id="grid" class="timeline-grid"><div id="ruler" class="ruler"></div><div id="rows"></div><div id="head" class="playhead"></div></div></div><div class="status"><span class="dot"></span><span id="status">端末プレビュー</span><span class="spacer"></span><span>クラウド未接続</span></div></section>
</div>
<dialog id="importDialog"><h3>メディアをインポート</h3><button id="photos">▧　写真・ビデオ</button><button id="files">▱　ファイルから選択</button><p>この試作では端末上の素材を参照します。素材をサーバーに送信しません。</p><button id="closeDialog" style="text-align:center">キャンセル</button></dialog>
<input id="photoInput" type="file" accept="image/*,video/*" multiple hidden><input id="fileInput" type="file" accept="image/*,video/*,.json" multiple hidden><div id="toast" class="toast" role="status"></div>
<script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('canvas'),ctx=canvas.getContext('2d');
let assets=[],layers=[],selectedAsset=null,selectedLayer=null,time=0,duration=10,playing=false,raf=0,last=0,uid=0,toastTimer;
const id=()=>++uid, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2800)}
function sampleAsset(name,kind,color){const c=document.createElement('canvas');c.width=960;c.height=540;const x=c.getContext('2d');x.fillStyle=color;x.fillRect(0,0,960,540);if(kind==='background'){const g=x.createLinearGradient(0,0,960,540);g.addColorStop(0,'#182d43');g.addColorStop(.55,'#3e335c');g.addColorStop(1,'#815b66');x.fillStyle=g;x.fillRect(0,0,960,540);x.strokeStyle='#ffffff0d';for(let a=0;a<960;a+=60){x.beginPath();x.moveTo(a,0);x.lineTo(a,540);x.stroke()}for(let a=0;a<540;a+=60){x.beginPath();x.moveTo(0,a);x.lineTo(960,a);x.stroke()}x.strokeStyle='#b3b6d833';x.beginPath();x.arc(760,180,160,0,Math.PI*2);x.stroke()}return {id:id(),name,type:'image',el:c,url:c.toDataURL(),duration:10,width:960,height:540,sample:true}}
assets.push(sampleAsset('Gradient • demo','background','#25344a'));selectedAsset=assets[0].id;
layers.push({id:id(),assetId:assets[0].id,name:'Gradient • demo',type:'image',start:0,end:10,x:50,y:50,scale:100,opacity:100,visible:true});
layers.unshift({id:id(),name:'FRAME / 01',type:'text',text:'FRAME / 01',color:'#f2efff',start:0,end:10,x:50,y:47,scale:100,opacity:100,visible:true});selectedLayer=layers[0].id;
function current(){return layers.find(l=>l.id===selectedLayer)}
function renderPool(){const p=$('pool');p.replaceChildren();assets.forEach(a=>{const b=document.createElement('button');b.className='asset'+(a.id===selectedAsset?' selected':'');b.title=a.name;const thumb=document.createElement('div');thumb.className='thumb';if(a.type==='image'){const im=document.createElement('img');im.src=a.url;im.alt='';thumb.append(im)}else{const s=document.createElement('span');s.className='letter';s.textContent='▶';thumb.append(s)}const type=document.createElement('span');type.className='asset-type';type.textContent=a.type==='video'?'MOV':'IMG';const name=document.createElement('span');name.className='asset-name';name.textContent=a.name;b.append(thumb,type,name);b.onclick=()=>{selectedAsset=a.id;renderPool()};b.ondblclick=()=>addAsset();p.append(b)});$('count').textContent=assets.length+' items';const a=assets.find(a=>a.id===selectedAsset);$('assetInfo').textContent=a?`${a.width} × ${a.height}${a.type==='video'?' / '+a.duration.toFixed(1)+'s':''} · ＋で追加`:'素材を選択 → ＋でタイムラインへ';$('add').disabled=!a}
function addAsset(){const a=assets.find(a=>a.id===selectedAsset);if(!a)return;const l={id:id(),assetId:a.id,name:a.name,type:a.type,start:time,end:Math.min(duration,time+(a.type==='video'?a.duration:5)),x:50,y:50,scale:100,opacity:100,visible:true};if(l.end<=l.start){toast('再生位置を前に戻してください');return}layers.unshift(l);selectedLayer=l.id;refresh()}
function renderTimeline(){const ruler=$('ruler');ruler.replaceChildren();for(let i=0;i<=10;i++){const t=document.createElement('span');t.className='tick';t.style.left=i*10+'%';t.textContent=(duration*i/10).toFixed(duration>20?0:1)+'s';if(i===10)t.style.transform='translateX(-100%)';ruler.append(t)}const rows=$('rows');rows.replaceChildren();layers.forEach((l,i)=>{const row=document.createElement('div');row.className='row'+(l.id===selectedLayer?' active':'');const name=document.createElement('div');name.className='layer-name';const eye=document.createElement('button');eye.textContent=l.visible?'●':'○';eye.setAttribute('aria-label',l.visible?'レイヤーを非表示':'レイヤーを表示');eye.onclick=e=>{e.stopPropagation();l.visible=!l.visible;refresh()};const num=document.createElement('span');num.className='layer-no';num.textContent=String(i+1).padStart(2,'0');const label=document.createElement('span');label.className='name';label.textContent=(l.type==='text'?'T  ':'')+l.name;name.append(eye,num,label);name.onclick=()=>{selectedLayer=l.id;renderTimeline();renderProperties()};const track=document.createElement('div');track.className='track';const clip=document.createElement('div');clip.className='clip '+l.type;clip.style.left=l.start/duration*100+'%';clip.style.width=(l.end-l.start)/duration*100+'%';clip.textContent=l.name;clip.onpointerdown=e=>dragClip(e,l,track,clip);track.append(clip);track.onpointerdown=e=>{if(e.target===track)scrub(e,track)};row.append(name,track);rows.append(row)});updateHead()}
function renderProperties(){const p=$('properties');p.replaceChildren();const l=current();$('delete').disabled=$('duplicate').disabled=!l;if(!l)return;function field(label,key,step,min,max){const wrap=document.createElement('label');wrap.textContent=label;const input=document.createElement('input');input.type='number';input.value=l[key];input.step=step;if(min!==undefined)input.min=min;if(max!==undefined)input.max=max;input.setAttribute('aria-label',label);input.oninput=()=>{if(input.value==='')return;l[key]=clamp(Number(input.value),min??-10000,max??10000);draw()};wrap.append(input);p.append(wrap)}
if(l.type==='text'){const input=document.createElement('input');input.className='text-input';input.value=l.text;input.setAttribute('aria-label','テキスト内容');input.oninput=()=>{l.text=input.value;l.name=input.value||'Text';renderTimeline();draw()};p.append(input);const color=document.createElement('input');color.type='color';color.value=l.color;color.setAttribute('aria-label','文字色');color.oninput=()=>{l.color=color.value;draw()};p.append(color)}field('X','x',1,-200,300);field('Y','y',1,-200,300);field('拡大 %','scale',1,1,1000);field('不透明 %','opacity',1,0,100);field('開始 s','start',.1,0,duration);field('終了 s','end',.1,0,duration);p.querySelectorAll('input[type=number]').forEach(inp=>inp.addEventListener('change',()=>{if(l.end<=l.start){l.end=Math.min(duration,l.start+.1);if(l.end<=l.start)l.start=Math.max(0,l.end-.1)}renderTimeline();draw()}))}
function draw(){const w=canvas.width,h=canvas.height;ctx.fillStyle='#09090c';ctx.fillRect(0,0,w,h);for(let i=layers.length-1;i>=0;i--){const l=layers[i];if(!l.visible||time<l.start||time>=l.end)continue;ctx.save();ctx.globalAlpha=l.opacity/100;ctx.translate(w*l.x/100,h*l.y/100);ctx.scale(l.scale/100,l.scale/100);if(l.type==='text'){ctx.fillStyle=l.color;ctx.font=`600 ${w*.07}px -apple-system,BlinkMacSystemFont,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(l.text,0,0)}else{const a=assets.find(a=>a.id===l.assetId);if(a){let el=a.el;if(a.type==='video'){el=a.previewLayer===l.id?a.el:a.instances?.get(l.id);if(!el){el=document.createElement('video');el.src=a.url;el.playsInline=true;el.muted=true;el.preload='auto';a.instances??=new Map();a.instances.set(l.id,el);el.onseeked=draw;el.onloadeddata=draw}const target=clamp(time-l.start,0,Math.max(0,a.duration-.03));if(Math.abs(el.currentTime-target)>.07&&!el.seeking){try{el.currentTime=target}catch{}}}const fit=Math.min(w/a.width,h/a.height);if(a.type!=='video'||el.readyState>=2){try{ctx.drawImage(el,-a.width*fit/2,-a.height*fit/2,a.width*fit,a.height*fit)}catch{}}}}ctx.restore()}$('time').textContent=formatTime(time);updateHead()}
function formatTime(t){let f=Math.floor(t*30+.00001);return `${Math.floor(f/108000)}:${String(Math.floor(f/1800)%60).padStart(2,'0')}:${String(Math.floor(f/30)%60).padStart(2,'0')}:${String(f%30).padStart(2,'0')}`}
function updateHead(){const width=$('ruler').getBoundingClientRect().width;$('head').style.left=(114+width*time/duration)+'px'}
function setTime(t){time=clamp(t,0,duration);draw()}
function stop(){playing=false;cancelAnimationFrame(raf);$('play').textContent='▶';$('play').setAttribute('aria-label','再生')}
function tick(now){if(!playing)return;time+=(now-last)/1000;last=now;if(time>=duration){time=duration;stop();draw();return}draw();raf=requestAnimationFrame(tick)}
function scrub(e,el){stop();el.setPointerCapture(e.pointerId);const move=ev=>{const r=el.getBoundingClientRect();setTime((ev.clientX-r.left)/r.width*duration)};move(e);el.onpointermove=move;el.onpointerup=el.onpointercancel=()=>{el.onpointermove=null;el.onpointerup=null;el.onpointercancel=null}}
function dragClip(e,l,track,clip){e.stopPropagation();stop();selectedLayer=l.id;const initial=e.clientX,begin=l.start,len=l.end-l.start,width=track.getBoundingClientRect().width;clip.setPointerCapture(e.pointerId);clip.onpointermove=ev=>{l.start=Math.round(clamp(begin+(ev.clientX-initial)/width*duration,0,duration-len)*30)/30;l.end=l.start+len;clip.style.left=l.start/duration*100+'%';draw()};clip.onpointerup=clip.onpointercancel=()=>{clip.onpointermove=null;refresh()};renderProperties();document.querySelectorAll('.row').forEach((r,i)=>r.classList.toggle('active',layers[i].id===l.id))}
function refresh(){renderTimeline();renderProperties();draw()}
async function importFiles(files){for(const file of files){if(file.name.toLowerCase().endsWith('.json')){toast('プロジェクトの再読み込みは次の試作で対応します');continue}if(!file.type.startsWith('image/')&&!file.type.startsWith('video/')){toast('写真または動画を選択してください');continue}const url=URL.createObjectURL(file);try{let a={id:id(),name:file.name,type:file.type.startsWith('video/')?'video':'image',url,size:file.size};if(a.type==='image'){const im=new Image();await new Promise((res,rej)=>{im.onload=res;im.onerror=rej;im.src=url});a.el=im;a.width=im.naturalWidth;a.height=im.naturalHeight;a.duration=5}else{const v=document.createElement('video');v.preload='metadata';v.playsInline=true;v.muted=true;await new Promise((res,rej)=>{const timer=setTimeout(()=>rej(Error('timeout')),15000);v.onloadedmetadata=()=>{clearTimeout(timer);res()};v.onerror=()=>{clearTimeout(timer);rej(Error('codec'))};v.src=url});if(!Number.isFinite(v.duration)||v.duration<=0)throw Error('duration');a.el=v;a.width=v.videoWidth;a.height=v.videoHeight;a.duration=v.duration}assets.push(a);selectedAsset=a.id;renderPool();toast(file.name+' を追加しました')}catch{URL.revokeObjectURL(url);toast(file.name+' を読み込めません。対応形式をご確認ください')}}}
$('import').onclick=()=>$('importDialog').showModal();$('closeDialog').onclick=()=>$('importDialog').close();$('photos').onclick=()=>{$('importDialog').close();$('photoInput').click()};$('files').onclick=()=>{$('importDialog').close();$('fileInput').click()};for(const n of ['photoInput','fileInput'])$(n).onchange=async e=>{await importFiles(e.target.files);e.target.value=''};
$('add').onclick=addAsset;$('ruler').onpointerdown=e=>scrub(e,$('ruler'));$('play').onclick=()=>{if(playing){stop();return}if(time>=duration)time=0;playing=true;last=performance.now();$('play').textContent='Ⅱ';$('play').setAttribute('aria-label','一時停止');raf=requestAnimationFrame(tick)};$('start').onclick=()=>{stop();setTime(0)};$('next').onclick=()=>{stop();setTime(time+1/30)};
$('text').onclick=()=>{const l={id:id(),name:'Text',type:'text',text:'Text',color:'#ffffff',start:Math.min(time,duration-.1),end:duration,x:50,y:50,scale:100,opacity:100,visible:true};layers.unshift(l);selectedLayer=l.id;refresh();const inp=$('properties').querySelector('input');inp.focus();inp.select()};$('delete').onclick=()=>{layers=layers.filter(l=>l.id!==selectedLayer);selectedLayer=layers[0]?.id??null;refresh()};$('duplicate').onclick=()=>{const l=current();if(!l)return;const c={...l,id:id(),name:l.name+' copy'};layers.splice(layers.indexOf(l),0,c);selectedLayer=c.id;refresh()};$('quality').onchange=e=>{canvas.width=Number(e.target.value);canvas.height=canvas.width*9/16;draw()};$('duration').onchange=e=>{stop();duration=clamp(Number(e.target.value)||10,1,300);e.target.value=duration;for(const l of layers){l.start=Math.min(l.start,duration-.1);l.end=clamp(l.end,l.start+.1,duration)}time=Math.min(time,duration);refresh()};$('save').onclick=()=>{const data={version:1,composition:{width:1920,height:1080,fps:30,duration},layers,assets:assets.map(({id,name,type,duration,width,height,sample})=>({id,name,type,duration,width,height,sample})),note:'素材本体は含まれません。クラウド保存・再読み込みは未実装です。'};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='frame-project.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('編集内容をJSONで保存しました（素材を除く）')};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});window.addEventListener('resize',updateHead);renderPool();refresh();
