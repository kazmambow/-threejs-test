outliner.addEventListener('pointerdown',e=>{const name=e.target.closest('[data-drag-object]');if(!name)return;const id=Number(name.dataset.dragObject);const row=name.closest('.object');objectDrag={id,startX:e.clientX,startY:e.clientY,active:false,ghost:null,row};name.setPointerCapture(e.pointerId)});
outliner.addEventListener('pointermove',e=>{const d=objectDrag;if(!d)return;if(!d.active&&Math.hypot(e.clientX-d.startX,e.clientY-d.startY)>8){d.active=true;d.ghost=document.createElement('div');d.ghost.className='dragGhost';d.ghost.textContent=items.find(x=>x.id===d.id)?.name||'Object';document.body.append(d.ghost)}if(!d.active)return;e.preventDefault();d.ghost.style.left=e.clientX+10+'px';d.ghost.style.top=e.clientY+10+'px';document.querySelectorAll('.dropTarget').forEach(n=>n.classList.remove('dropTarget'));const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop-folder],[data-drop-root]');if(hit)hit.classList.add('dropTarget')});
function finishObjectDrag(e){const d=objectDrag;if(!d)return;objectDrag=null;d.ghost?.remove();document.querySelectorAll('.dropTarget').forEach(n=>n.classList.remove('dropTarget'));if(!d.active)return;const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop-folder],[data-drop-root]');if(!hit)return;const x=items.find(x=>x.id===d.id);if(!x)return;x.folderId=hit.dataset.dropRoot?null:Number(hit.dataset.dropFolder);build(x);renderList();record()}
outliner.addEventListener('pointerup',finishObjectDrag);outliner.addEventListener('pointercancel',()=>{objectDrag?.ghost?.remove();objectDrag=null});
new ResizeObserver(()=>document.documentElement.style.setProperty('--header-height',document.querySelector('header').getBoundingClientRect().height+'px')).observe(document.querySelector('header'));
new ResizeObserver(resizeRender).observe(host);
add('cylinder');renderMaterials();function frame(){requestAnimationFrame(frame);const controlsChanged=orbit.update();const now=performance.now();if(timeline.playing&&now-timeline.last>=1000/timeline.fps){timeline.time+=(now-timeline.last)/1000;timeline.last=now;rebuildFolders();syncTransport()}if(sceneNeedsRender||controlsChanged){const start=performance.now();renderScene();sceneNeedsRender=false;updatePerformanceHud(now,true,performance.now()-start)}else updatePerformanceHud(now,false)}frame();
</script></body></html>
